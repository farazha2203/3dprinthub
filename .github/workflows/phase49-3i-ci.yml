name: Phase49.3I Discovery Review Pricing CI

on:
  push:
    branches:
      - epic/phase49-unified-product-slider-sync
  pull_request:
    branches:
      - epic/phase49-unified-product-slider-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase49-3i:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-phase49-3i-secret-key"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      CATALOG_BRIDGE_TOKEN: "phase49-3i-ci-token-12345678901234567890"
      MEDIA_ROOT: "/tmp/3dprinthub-3i/media"
      PRIVATE_MEDIA_ROOT: "/tmp/3dprinthub-3i/private-media"
      STATIC_ROOT: "/tmp/3dprinthub-3i/static"
      CATALOG_BRIDGE_PENDING_ROOT: "/tmp/3dprinthub-3i/imports/pending"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Phase49.3I PowerShell runner contract
        shell: pwsh
        run: |
          $runnerPath = "RUN_PHASE49_3I_LOCAL_GATE.ps1"
          $runnerBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $runnerPath))
          $nonAscii = @($runnerBytes | Where-Object { $_ -gt 127 })
          if ($nonAscii.Count -gt 0) {
            throw "49.3I runner must remain ASCII-only for Windows PowerShell 5.1 compatibility. Non-ASCII bytes: $($nonAscii.Count)"
          }

          $runner = [System.Text.Encoding]::ASCII.GetString($runnerBytes)
          [void][scriptblock]::Create($runner)
          if ($runner -notmatch '\$RunnerVersion\s*=\s*"49\.3I\.12"') { throw "49.3I.12 runner version missing" }
          if ($runner -notmatch 'ASCII_ONLY_FOR_WINDOWS_POWERSHELL_5_1') { throw "49.3I encoding contract marker missing" }
          if ($runner -notmatch '\$ExpectedBranch\s*=\s*"epic/phase49-unified-product-slider-sync"') { throw "49.3I expected branch guard missing" }
          if ($runner -notmatch 'git"\s+-Arguments\s+@\("fetch",\s*"--prune",\s*"origin"\)') { throw "49.3I live GitHub fetch guard missing" }
          if ($runner -notmatch 'origin/\$ExpectedBranch') { throw "49.3I fetched remote ref guard missing" }
          if ($runner -notmatch 'PHASE49_3I_GIT_SNAPSHOT=OK') { throw "49.3I fetched snapshot marker missing" }
          if ($runner -notmatch 'PHASE49_3I_EXPLORER_HOTFIX=ENABLED') { throw "49.3I explorer hotfix marker missing" }
          if ($runner -notmatch 'PHASE49_3I_SELECTION_LOOP_GUARD=ENABLED') { throw "49.3I selection-loop guard marker missing" }
          if ($runner -notmatch 'PHASE49_3I_CARD_METADATA=ENABLED') { throw "49.3I compact metadata marker missing" }
          if ($runner -notmatch 'PHASE49_3I_FRIENDLY_FILTER_SORT=ENABLED') { throw "49.3I filter/sort marker missing" }
          if ($runner -notmatch 'PHASE49_3I_SECRET_PERSISTENCE=ENABLED') { throw "49.3I secure credential persistence marker missing" }
          if ($runner -notmatch 'PHASE49_3I_PREVIEW_EVAL_RECOVERY=ENABLED') { throw "49.3I preview evaluator recovery marker missing" }
          if ($runner -notmatch 'PHASE49_3I_PROVIDER_HUB_PERSISTENCE=ENABLED') { throw "49.3I provider hub persistence marker missing" }
          if ($runner -notmatch 'PHASE49_3I_PROVIDER_MODELS_AUTOLOAD=ENABLED') { throw "49.3I provider model autoload marker missing" }
          if ($runner -notmatch 'PHASE49_3I_AI_EXECUTION_RECOVERY=ENABLED') { throw "49.3I AI execution recovery marker missing" }
          if ($runner -notmatch 'PHASE49_3I_LEGACY_AI_ROUTING=TASK_CENTER') { throw "49.3I legacy AI routing marker missing" }
          if ($runner -notmatch 'PHASE49_3I_AI_WATCHDOG=210S') { throw "49.3I AI watchdog marker missing" }
          if ($runner -notmatch 'PHASE49_3I_AI_REFRESH_COMPLETION=ENABLED') { throw "49.3I AI refresh completion marker missing" }
          if ($runner -notmatch 'PHASE49_3I_IMAGE_PREFLIGHT_REFETCH=ENABLED') { throw "49.3I image preflight marker missing" }
          if ($runner -notmatch 'PHASE49_3I_GENERIC_TITLE_GUARD=ENABLED') { throw "49.3I generic-title guard marker missing" }
          if ($runner -notmatch 'PHASE49_3I_DEFAULT_PRICE=500000') { throw "49.3I default price marker missing" }
          if ($runner -notmatch 'PHASE49_3I_SEO_SOURCE_SYNC=ENABLED') { throw "49.3I storefront SEO/source sync marker missing" }
          if ($runner -notmatch 'PHASE49_3I_AI_TRACE_CONSOLE=ENABLED') { throw "49.3I AI trace console marker missing" }
          if ($runner -notmatch 'PHASE49_3I_TITLE_WATCHDOG=90S') { throw "49.3I title watchdog marker missing" }
          if ($runner -notmatch 'PHASE49_3I_EXCEPTION_CALLBACK_GUARD=ENABLED') { throw "49.3I exception callback guard marker missing" }
          if ($runner -notmatch 'PHASE49_3I_PROVIDER_SCHEMA_STRICT=ENABLED') { throw "49.3I strict provider schema marker missing" }
          if ($runner -notmatch 'PHASE49_3I_SCHEMA_REPAIR_ONCE=ENABLED') { throw "49.3I one-repair marker missing" }
          if ($runner -notmatch 'PHASE49_3I_MODEL_TRACE_COMPACT=ENABLED') { throw "49.3I model trace compaction marker missing" }
          if ($runner -notmatch 'PHASE49_3I_BUSY_RELEASE_ON_ABORT=ENABLED') { throw "49.3I busy release marker missing" }
          if ($runner -notmatch 'PHASE49_3I_EXACT_PAGE_OPERATOR=ENABLED') { throw "49.3I exact page operator marker missing" }
          if ($runner -notmatch 'PHASE49_3I_SINGLE_PRODUCT_OPERATOR=ENABLED') { throw "49.3I single product operator marker missing" }
          if ($runner -notmatch 'PHASE49_3I_DISCOVERY_LIVE_STATUS=ENABLED') { throw "49.3I discovery live-status marker missing" }
          if ($runner -notmatch 'PHASE49_3I_WORKSPACE_IMAGE_FIT=228X171_CONTAIN') { throw "49.3I workspace image-fit marker missing" }
          if ($runner -notmatch 'phase49_3i_ai_refresh_completion\.py') { throw "49.3I AI refresh source missing from runner" }
          if ($runner -notmatch 'test_epic49_phase49_3i_ai_refresh_completion') { throw "49.3I AI refresh tests missing from runner" }
          if ($runner -notmatch 'phase49_3i_ai_trace_recovery\.py') { throw "49.3I AI trace source missing from runner" }
          if ($runner -notmatch 'test_epic49_phase49_3i_ai_trace_recovery') { throw "49.3I AI trace tests missing from runner" }
          if ($runner -notmatch 'phase49_3i_schema_runtime_recovery\.py') { throw "49.3I schema runtime source missing from runner" }
          if ($runner -notmatch 'test_epic49_phase49_3i_schema_runtime_recovery') { throw "49.3I schema runtime tests missing from runner" }
          if ($runner -notmatch 'phase49_3i12_discovery_image_recovery\.py') { throw "49.3I.12 operator/image source missing from runner" }
          if ($runner -notmatch 'test_epic49_phase49_3i12_discovery_image_recovery') { throw "49.3I.12 operator/image tests missing from runner" }
          if ($runner -notmatch 'phase49_3i9_seo_sync\.py') { throw "49.3I SEO sync source missing from runner" }
          if ($runner -notmatch 'test_phase49_3i9_seo_sync') { throw "49.3I SEO sync tests missing from runner" }
          if ($runner -notmatch 'RUN_PHASE49_3H_LOCAL_GATE\.ps1') { throw "49.3I must chain 49.3H gate" }
          if ($runner -notmatch 'EPIC49_3I_EXACT_SEARCH_URL=ENABLED') { throw "49.3I exact-search marker missing" }
          if ($runner -notmatch 'EPIC49_3I_PRODUCT_GALLERY_CARDS=ENABLED') { throw "49.3I product gallery marker missing" }
          if ($runner -notmatch 'EPIC49_3I_AI_PROGRESS_FIRST_PAINT=ENABLED') { throw "49.3I AI first-paint marker missing" }
          if ($runner -notmatch 'EPIC49_3I_PRICING_FIXED_RANGE_FORMULA=ENABLED') { throw "49.3I pricing marker missing" }
          if ($runner -notmatch 'Production\s*=\s*UNTOUCHED') { throw "Production guard missing" }
          Write-Host "PHASE49_3I_RUNNER_ASCII=OK"
          Write-Host "PHASE49_3I_GIT_HANDOFF_CONTRACT=OK"
          Write-Host "PHASE49_3I_AI_REFRESH_COMPLETION_CONTRACT=OK"
          Write-Host "PHASE49_3I_AI_TRACE_RECOVERY_CONTRACT=OK"
          Write-Host "PHASE49_3I_SCHEMA_RUNTIME_RECOVERY_CONTRACT=OK"
          Write-Host "PHASE49_3I_DISCOVERY_OPERATOR_IMAGE_FIT_CONTRACT=OK"
          Write-Host "PHASE49_3I_SEO_SOURCE_SYNC_CONTRACT=OK"
          Write-Host "PHASE49_3I_RUNNER_CONTRACT=OK"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare isolated CI runtime directories
        run: |
          rm -rf /tmp/3dprinthub-3i
          mkdir -p "$MEDIA_ROOT" "$PRIVATE_MEDIA_ROOT" "$STATIC_ROOT" "$CATALOG_BRIDGE_PENDING_ROOT"

      - name: Compile Phase49.3I
        run: |
          python -m compileall -q \
            catalog_center/app/openai_content.py \
            catalog_center/app/phase49_3i_discovery_review.py \
            catalog_center/app/phase49_3i_preview_recovery.py \
            catalog_center/app/phase49_3i_source_safety.py \
            catalog_center/app/phase49_3i_product_list.py \
            catalog_center/app/phase49_3i_explorer_hotfix.py \
            catalog_center/app/phase49_3i_local_qa_hotfix.py \
            catalog_center/app/phase49_3i_ai_execution_recovery.py \
            catalog_center/app/phase49_3i_ai_refresh_completion.py \
            catalog_center/app/phase49_3i_ai_trace_recovery.py \
            catalog_center/app/phase49_3i_schema_runtime_recovery.py \
            catalog_center/app/phase49_3i12_discovery_image_recovery.py \
            catalog_center/app/phase49_3i_pricing_modes.py \
            catalog_center/app/phase49_3i_secret_persistence.py \
            store/phase49_3i_pricing_modes.py \
            store/phase49_3i9_seo_sync.py \
            store/apps.py \
            catalog_center/launch.py

      - name: Phase49.3I Catalog Center dedicated tests
        working-directory: catalog_center
        run: |
          python -m unittest -v \
            tests.test_epic49_phase49_3i_discovery_review \
            tests.test_epic49_phase49_3i_preview_recovery \
            tests.test_epic49_phase49_3i_source_safety \
            tests.test_epic49_phase49_3i_product_list \
            tests.test_epic49_phase49_3i_explorer_hotfix \
            tests.test_epic49_phase49_3i_local_qa_hotfix \
            tests.test_epic49_phase49_3i_ai_execution_recovery \
            tests.test_epic49_phase49_3i_ai_refresh_completion \
            tests.test_epic49_phase49_3i_ai_trace_recovery \
            tests.test_epic49_phase49_3i_schema_runtime_recovery \
            tests.test_epic49_phase49_3i12_discovery_image_recovery \
            tests.test_epic49_phase49_3i_pricing_modes \
            tests.test_epic49_phase49_3i_secret_persistence \
            tests.test_epic49_phase49_3h_image_limits \
            tests.test_epic49_phase49_3h_seo_execution \
            tests.test_epic49_phase49_3g_workspace_usability \
            tests.test_epic49_phase49_3g_commerce_provenance \
            tests.test_epic49_phase49_3c_image_signature

      - name: Phase49.3I AI discovery image and source safety contract
        run: |
          python - <<'PY'
          from pathlib import Path
          completion = Path("catalog_center/app/phase49_3i_ai_refresh_completion.py").read_text(encoding="utf-8")
          trace = Path("catalog_center/app/phase49_3i_ai_trace_recovery.py").read_text(encoding="utf-8")
          schema_runtime = Path("catalog_center/app/phase49_3i_schema_runtime_recovery.py").read_text(encoding="utf-8")
          operator = Path("catalog_center/app/phase49_3i12_discovery_image_recovery.py").read_text(encoding="utf-8")
          pricing = Path("catalog_center/app/phase49_3i_pricing_modes.py").read_text(encoding="utf-8")
          content = Path("catalog_center/app/openai_content.py").read_text(encoding="utf-8")
          local_qa = Path("catalog_center/app/phase49_3i_local_qa_hotfix.py").read_text(encoding="utf-8")
          seo_sync = Path("store/phase49_3i9_seo_sync.py").read_text(encoding="utf-8")
          apps = Path("store/apps.py").read_text(encoding="utf-8")

          assert "install_ai_refresh_completion(workspace_class, task_center_module)" in local_qa
          assert "install_ai_trace_recovery(workspace_class, phase49_3f_workspace_module)" in local_qa
          assert "install_schema_runtime_recovery(workspace_class, phase49_3f_workspace_module, trace_module)" in local_qa
          assert "self.refetch()" in completion
          assert "normalize_image_limit" in completion
          assert "extract_direct_link(" not in completion
          assert "collect_classic_exact(" not in completion
          assert "async_playwright" not in completion
          assert "build_refresh_updates" in completion
          assert "manual_override" in completion
          assert "DEFAULT_PRICE_TOMAN = 500_000" in completion
          assert "source_name" in completion
          assert "TITLE_WATCHDOG_MS = 90_000" in trace
          assert "TraceableAIProgress" in trace
          assert "traced_json_request" in trace
          assert "traced_google_request" in trace
          assert "_freeze_exception_callback" in trace
          assert "phase49-3i10-title-stale-result-discarded" in trace
          assert "orient=\"vertical\"" in trace and "orient=\"horizontal\"" in trace
          assert '"type": "json_schema"' in schema_runtime
          assert "structured_content_repair" in schema_runtime
          assert "previous_invalid_output" in schema_runtime
          assert "MODEL_TRACE_SAMPLE_LIMIT" in schema_runtime
          assert "cached_for_request" in schema_runtime
          assert "_release_busy_state" in schema_runtime
          assert "original_ui = app_class._ui" in operator
          assert "original_start_candidate" in operator
          assert "کشف لینک‌های همین صفحه" in operator
          assert "دریافت محصول تکی" in operator
          assert "درخواست توقف ثبت شد" in operator
          assert "ImageOps.contain" in operator
          assert "CARD_VIEWPORT = (228, 171)" in operator
          assert "_phase49_3i12_composition_bridge" in pricing
          assert "_install_phase49_3i12_workspace(workspace_class)" in pricing
          assert "validate_content_pack" in content
          assert "SOURCE TITLE IS AUTHORITATIVE PRODUCT IDENTITY" in content
          assert "Never replace a specific source title with generic phrases" in content
          assert "install_phase49_3i9_seo_sync()" in apps
          assert "publishing.convert_to_fixed_product = convert_to_fixed_product" in seo_sync
          assert '"meta_title"' in seo_sync
          assert '"meta_description"' in seo_sync
          assert '"source_attribution"' in seo_sync

          print("PHASE49_3I_AI_REFRESH_COMPLETION=AI_OWNED_REFRESH_MANUAL_SAFE")
          print("PHASE49_3I_AI_TRACE_CONSOLE=SANITIZED_REQUEST_RESPONSE_SCROLLABLE")
          print("PHASE49_3I_PROVIDER_SCHEMA=STRICT_WITH_ONE_REPAIR")
          print("PHASE49_3I_MODEL_TRACE=COMPACT_UI_SAFE")
          print("PHASE49_3I_BUSY_RELEASE=ABORT_RETRY_SAFE")
          print("PHASE49_3I_DISCOVERY_OPERATOR=EXACT_PAGE_SINGLE_URL_LIVE_STATUS")
          print("PHASE49_3I_WORKSPACE_IMAGE_FIT=228X171_CONTAIN")
          print("PHASE49_3I_TITLE_WATCHDOG=90S_STALE_SAFE")
          print("PHASE49_3I_EXCEPTION_CALLBACK_GUARD=ENABLED")
          print("PHASE49_3I_IMAGE_PREFLIGHT_REFETCH=MATURE_PATH_ONLY")
          print("PHASE49_3I_GENERIC_TITLE_GUARD=ENABLED")
          print("PHASE49_3I_SEO_SOURCE_SYNC=REAL_PRODUCT_FIELDS")
          PY

      - name: Phase49.3I Django pricing SEO and migration contract
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan
          python manage.py test \
            store.test_phase49_3i_pricing_modes \
            store.test_phase49_3i9_seo_sync \
            store.test_phase49_3f_pricing \
            store.test_phase49_3d_price_range \
            store.test_phase49_unified_import_e2e \
            -v 2
          echo "PHASE49_3I_DJANGO_MIGRATION=NONE"

      - name: Phase49.3I launcher markers
        working-directory: catalog_center
        run: |
          python launch.py --verify-only | tee /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_EXACT_SEARCH_URL=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_DISCOVERY_REVIEW_QUEUE=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_PREVIEW_ONE_IMAGE=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_APPROVAL_BEFORE_FULL_FETCH=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_ARCHIVE_BLOCK_DEDUPE=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_SOURCE_TEXT_LATIN_SAFE=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_LIGHTWEIGHT_PRODUCT_LIST=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_PRODUCT_GALLERY_CARDS=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_PRODUCT_LIST_ONLY_IMAGE_NAME_EDIT=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_AI_PROGRESS_FIRST_PAINT=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3I_PRICING_FIXED_RANGE_FORMULA=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3H_IMAGE_LIMIT_HARD_MAX_20=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3H_SEO_EXECUTION_CONSOLE=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3H_RESULT_ERROR_DRAWER=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "EPIC49_3G_MANUAL_OVERRIDE_GUARD=ENABLED" /tmp/phase49-3i-verify.txt
          grep -F "ACTIVE_RELEASE_VERIFIED=OK" /tmp/phase49-3i-verify.txt

      - name: Phase49.3I no destructive schema operations
        run: |
          python - <<'PY'
          from pathlib import Path
          sources = [
              Path("catalog_center/app/phase49_3i_discovery_review.py"),
              Path("catalog_center/app/phase49_3i_preview_recovery.py"),
              Path("catalog_center/app/phase49_3i_product_list.py"),
              Path("catalog_center/app/phase49_3i_explorer_hotfix.py"),
              Path("catalog_center/app/phase49_3i_local_qa_hotfix.py"),
              Path("catalog_center/app/phase49_3i_ai_execution_recovery.py"),
              Path("catalog_center/app/phase49_3i_ai_refresh_completion.py"),
              Path("catalog_center/app/phase49_3i_ai_trace_recovery.py"),
              Path("catalog_center/app/phase49_3i_schema_runtime_recovery.py"),
              Path("catalog_center/app/phase49_3i12_discovery_image_recovery.py"),
              Path("catalog_center/app/phase49_3i_secret_persistence.py"),
              Path("store/phase49_3i9_seo_sync.py"),
          ]
          forbidden = ["drop table", "truncate table", "delete from products"]
          found = []
          for path in sources:
              text = path.read_text(encoding="utf-8").lower()
              found.extend((str(path), token) for token in forbidden if token in text)
          assert not found, found
          print("PHASE49_3I_SCHEMA_SAFETY=ADDITIVE_LOCAL_ONLY")
          PY
