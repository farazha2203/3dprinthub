name: Phase50 Variant2 Gallery CI

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - store/apps.py
      - store/phase50_variant2.py
      - store/phase50_variant_admin.py
      - store/phase50_variant_views.py
      - store/urls.py
      - store/migrations/0034_phase50_variant2_commerce.py
      - store/test_phase50_variant2_gallery.py
      - static/store/js/store.js
      - static/store/css/store.css
      - .github/workflows/phase50-variant2-gallery-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase50-variant2-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: phase50-variant2-ci-only-not-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile touched Python surfaces
        run: |
          python -m py_compile \
            store/apps.py \
            store/phase50_variant2.py \
            store/phase50_variant_admin.py \
            store/phase50_variant_views.py \
            store/urls.py \
            store/migrations/0034_phase50_variant2_commerce.py \
            store/test_phase50_variant2_gallery.py

      - name: Django system check
        run: python manage.py check

      - name: Migration state must match runtime models
        run: python manage.py makemigrations --check --dry-run

      - name: Migration plan
        run: python manage.py migrate --plan

      - name: Apply migrations in CI SQLite
        run: python manage.py migrate --noinput

      - name: Phase50 Variant2 and gallery regressions
        run: python manage.py test store.test_phase50_variant2_gallery -v 2

      - name: Gate marker
        run: |
          echo "PHASE50_VARIANT2_GALLERY_CI=PASS"
          echo "COMMIT=$GITHUB_SHA"
