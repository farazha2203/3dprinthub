name: Phase50 Variant2 + Profile Matrix CI

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - store/apps.py
      - store/phase50_variant2.py
      - store/phase50_variant_admin.py
      - store/phase50_variant_views.py
      - store/views.py
      - catalog_bridge/unified_views.py
      - catalog_bridge/urls.py
      - catalog_center/app/epic49_site_sync.py
      - store/phase34b_publishing.py
      - store/phase50_sales_profile_admin.py
      - store/phase50_commerce_policy.py
      - store/phase50_profile_matrix.py
      - store/phase50_filament_offer.py
      - store/phase49_3f_pricing.py
      - store/models.py
      - store/phase50_sales_profiles.py
      - store/phase50_checkout_snapshot.py
      - store/urls.py
      - store/migrations/0034_phase50_variant2_commerce.py
      - store/migrations/0035_phase50_sales_profiles.py
      - store/migrations/0036_phase50_checkout_snapshot.py
      - store/migrations/0037_phase50_professional_commerce_policy.py
      - store/migrations/0038_phase50_profile_matrix.py
      - store/migrations/0039_phase50_filament_offer_pricing.py
      - store/migrations/0040_phase50_filament_offer_operations.py
      - store/migrations/0041_phase50_filament_visual_identity.py
      - store/test_phase50_filament_offer_operations.py
      - store/test_phase50_variant2_gallery.py
      - store/test_phase50_checkout_snapshot.py
      - store/test_phase50_profile_matrix.py
      - templates/store/base.html
      - templates/store/product_detail.html
      - static/store/js/store.js
      - static/store/js/phase50-profile-selector.js
      - static/store/js/phase49-product-info-tabs.js
      - static/store/css/store.css
      - static/store/css/phase50-profile-selector.css
      - static/store/css/phase49-product-info-tabs.css
      - .github/workflows/phase50-variant2-gallery-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase50-variant2-gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: phase50-variant2-ci-only-not-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile touched Python surfaces
        run: |
          python -m py_compile \
            store/apps.py \
            store/phase50_variant2.py \
            store/phase50_variant_admin.py \
            store/phase50_variant_views.py \
            store/views.py \
            catalog_bridge/unified_views.py \
            catalog_bridge/urls.py \
            catalog_center/app/epic49_site_sync.py \
            store/phase50_sales_profiles.py \
            store/phase50_profile_matrix.py \
            store/phase50_filament_offer.py \
            store/phase49_3f_pricing.py \
            store/phase50_commerce_policy.py \
            store/phase50_sales_profile_admin.py \
            store/phase34b_publishing.py \
            store/phase50_checkout_snapshot.py \
            store/urls.py \
            store/migrations/0034_phase50_variant2_commerce.py \
            store/migrations/0035_phase50_sales_profiles.py \
            store/migrations/0036_phase50_checkout_snapshot.py \
            store/migrations/0037_phase50_professional_commerce_policy.py \
            store/migrations/0038_phase50_profile_matrix.py \
            store/migrations/0039_phase50_filament_offer_pricing.py \
            store/migrations/0040_phase50_filament_offer_operations.py \
            store/migrations/0041_phase50_filament_visual_identity.py \
            store/test_phase50_variant2_gallery.py \
            store/test_phase50_filament_offer_operations.py \
            store/test_phase50_checkout_snapshot.py \
            store/test_phase50_profile_matrix.py

      - name: Validate Storefront JavaScript
        run: |
          node --check static/store/js/store.js
          node --check static/store/js/phase50-profile-selector.js
          node --check static/store/js/phase49-product-info-tabs.js

      - name: Profile selector dependency behavior
        run: |
          node - <<'NODE'
          const assert = require("node:assert/strict");
          const core = require("./static/store/js/phase50-profile-selector.js");
          const variants = [
            {id:"20-100", size:"20", finalWeight:100, materialWeight:100, price:350000, build:"standard", material:"PLA", color:"", quality:"standard"},
            {id:"20-150", size:"20", finalWeight:150, materialWeight:150, price:450000, build:"standard", material:"PLA", color:"", quality:"standard"},
            {id:"30-150", size:"30", finalWeight:150, materialWeight:150, price:650000, build:"standard", material:"PLA", color:"", quality:"standard"},
            {id:"30-200", size:"30", finalWeight:200, materialWeight:200, price:750000, build:"standard", material:"PLA", color:"", quality:"standard"},
            {id:"30-300", size:"30", finalWeight:300, materialWeight:300, price:900000, build:"standard", material:"PLA", color:"", quality:"standard"},
          ];
          const dims = core.buildDimensions("size_weight", variants);
          assert.deepEqual(dims.slice(0,2), ["size","weight"]);
          const state = {size:"30", weight:"150"};
          const weightPool = core.variantsForDimension(variants, state, dims, 1);
          assert.deepEqual(weightPool.map(v => v.id), ["30-150","30-200","30-300"]);
          const priceFor150At30 = Math.min(...weightPool.filter(v => core.valueFor(v,"weight") === "150").map(v => v.price));
          assert.equal(priceFor150At30, 650000);
          core.clearDownstreamState(state, dims, 0);
          assert.deepEqual(state, {size:"30"});
          console.log("PHASE50_PROFILE_SELECTOR_HIERARCHY=PASS");
          NODE

      - name: Django system check
        run: python manage.py check

      - name: Migration state must match runtime models
        run: python manage.py makemigrations --check --dry-run

      - name: Migration plan
        run: python manage.py migrate --plan

      - name: Apply migrations in CI SQLite
        run: python manage.py migrate --noinput

      - name: Phase50 Variant2, profile matrix, gallery and checkout regressions
        run: |
          python manage.py test \
            store.test_phase50_variant2_gallery \
            store.test_phase50_checkout_snapshot \
            store.test_phase50_profile_matrix \
            store.test_phase50_filament_offer_operations \
            -v 2

      - name: Gate marker
        run: |
          echo "PHASE50_VARIANT2_GALLERY_CI=PASS"
          echo "PHASE50_CHECKOUT_SNAPSHOT_CI=PASS"
          echo "PHASE50_PROFILE_MATRIX_CI=PASS"
          echo "PHASE50_FILAMENT_OFFER_0039_CI=PASS"
          echo "PHASE50_FILAMENT_OFFER_0040_OPERATIONS_CI=PASS"
          echo "PHASE50_FILAMENT_VISUAL_0041_CI=PASS"
          echo "PHASE50_FILAMENT_SELECTOR_BRAND_PALETTE_FINISH_CI=PASS"
          echo "PHASE50_FILAMENT_BRIDGE_MEDIA_SYNC_CI=PASS"
          echo "PHASE50_CHECKOUT_FILAMENT_SNAPSHOT_CI=PASS"
          echo "COMMIT=$GITHUB_SHA"
