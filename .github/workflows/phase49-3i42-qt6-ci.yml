name: Phase49.3I.42C3 Qt6 Crawl + AI Runtime CI

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - "catalog_center/qt6/**"
      - "catalog_center/qt_launch.py"
      - "catalog_center/launch.py"
      - "catalog_center/app/version.py"
      - "catalog_center/PACKAGE_MANIFEST.json"
      - "catalog_center/config.example.json"
      - "catalog_center/requirements-qt6.txt"
      - "RUN_PHASE49_3I42C_LOCAL_GATE.ps1"
      - "catalog_center/tests/test_phase49_3i42_qt6_foundation.py"
      - "catalog_center/tests/test_phase49_3i42b_core_parity.py"
      - "catalog_center/tests/test_phase49_3i42c_acquisition_runtime.py"
      - "catalog_center/tests/test_phase49_3i42c3_ai_crawl_parity.py"
      - "catalog_center/tests/test_phase49_3i46_catalog_paging_parity.py"
      - "catalog_center/tests/test_phase49_3i47_qt_workspace_image_bulk_ai.py"
      - "catalog_center/tests/test_phase49_3i48_owner_filament_site_foundation.py"
      - "catalog_center/app/phase49_3c_image_pipeline.py"
      - "catalog_center/app/epic49_desktop_schema.py"
      - "catalog_center/app/epic49_site_sync.py"
      - "catalog_center/app/phase49_readiness_wizard.py"
      - "catalog_center/app/db.py"
      - "catalog_center/app/ai_model_catalog.py"
      - "catalog_center/app/ai_providers.py"
      - "catalog_center/tests/test_phase49_3i41_filament_library.py"
      - "catalog_center/app/classic_methods.py"
      - "catalog_center/app/page_extractor.py"
      - "catalog_center/app/phase49_3i16_resilient_acquisition.py"
      - "catalog_center/app/phase49_3i38_crawl_ledger_stage_ai.py"
      - "catalog_center/app/phase49_3i43_modern_acquisition_intelligence.py"
      - "catalog_center/app/phase49_3i45_incremental_discovery_intelligence.py"
      - ".github/workflows/phase49-3i42-qt6-ci.yml"
      # Release/version contract files are intentionally in this trigger set.
      # ERR-49-085 exposed that a version bump could otherwise skip this full
      # Qt parity gate while changing the manifest/launcher contract it tests.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qt6-full-parity-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout exact GitHub snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            catalog_center/requirements.txt
            catalog_center/requirements-qt6.txt

      - name: Validate owner Local gate on Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = (Resolve-Path "RUN_PHASE49_3I42C_LOCAL_GATE.ps1").Path
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $nonAscii = @($bytes | Where-Object { $_ -gt 127 })
          if ($nonAscii.Count -gt 0) {
            throw "Owner Local gate must remain ASCII-only per ERR-49-016"
          }

          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            $path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Owner Local gate failed Windows PowerShell 5.1 parser validation"
          }

          Write-Host "PHASE49_3I47_PS51_ASCII_PARSER_GUARD=PASS"

      - name: Validate owner Local gate and PowerShell Python stdin
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "RUN_PHASE49_3I42C_LOCAL_GATE.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.Message }
            throw "Phase49.3I.42C Local gate PowerShell syntax failed"
          }

          $probe = @'
          print("PYTHON_STDIN_PROBE=OK")
          '@
          $output = $probe | python -
          if ($LASTEXITCODE -ne 0) {
            throw "PowerShell -> Python stdin probe failed"
          }
          $probeText = ($output | Out-String)
          if ($probeText -notmatch "PYTHON_STDIN_PROBE=OK") {
            throw "PowerShell -> Python stdin marker missing"
          }
          Write-Host "PHASE49_3I42C_POWERSHELL_STDIN_GUARD=PASS"

      - name: Install Qt6 preview dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r catalog_center/requirements-qt6.txt
          python -c "import PySide6; print('PYSIDE6_VERSION=' + PySide6.__version__)"

      - name: Compile Qt6 and touched mature contracts
        shell: pwsh
        run: |
          python -m compileall -q catalog_center/qt6 catalog_center/qt_launch.py catalog_center/app/epic49_desktop_schema.py catalog_center/app/phase49_3b_guided_wizard.py catalog_center/app/phase49_3c_image_pipeline.py catalog_center/app/phase49_3f_workspace.py catalog_center/app/phase49_3f_gemini_provider.py catalog_center/app/phase49_3i17_single_active_ai_runtime.py catalog_center/app/phase49_3i34_profile_matrix.py catalog_center/app/phase49_3i35_operator_ledger.py catalog_center/app/phase49_3i36_stage_finalization.py catalog_center/app/phase49_3i37_seven_stage_ai.py catalog_center/app/phase49_3i39_professional_commerce.py catalog_center/app/classic_methods.py catalog_center/app/page_extractor.py catalog_center/app/phase49_3i16_resilient_acquisition.py catalog_center/app/phase49_3i38_crawl_ledger_stage_ai.py catalog_center/app/phase49_3i43_modern_acquisition_intelligence.py catalog_center/app/phase49_3i45_incremental_discovery_intelligence.py catalog_center/tests/test_phase49_3i42_qt6_foundation.py catalog_center/tests/test_phase49_3i42b_core_parity.py catalog_center/tests/test_phase49_3i42c_acquisition_runtime.py catalog_center/tests/test_phase49_3i42c3_ai_crawl_parity.py catalog_center/tests/test_phase49_3i46_catalog_paging_parity.py catalog_center/tests/test_phase49_3i47_qt_workspace_image_bulk_ai.py catalog_center/tests/test_phase49_3i48_owner_filament_site_foundation.py catalog_center/app/epic49_site_sync.py catalog_center/app/phase49_readiness_wizard.py catalog_center/app/db.py catalog_center/app/ai_model_catalog.py catalog_center/app/ai_providers.py
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 full parity compileall failed' }

      - name: Qt6 foundation and full parity tests
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i42_qt6_foundation tests.test_phase49_3i42b_core_parity
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 full parity tests failed' }

      - name: Qt6 acquisition strategy and continuation tests
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i42c_acquisition_runtime
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 acquisition strategy tests failed' }

      - name: Qt6 AI model cost diagnostics and crawl parity
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i42c3_ai_crawl_parity
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 AI/crawl parity tests failed' }

      - name: Qt6 bounded Product and Crawl paging parity
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i46_catalog_paging_parity
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 catalog paging parity tests failed' }

      - name: Qt6 workspace image SEO and bulk AI parity
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i47_qt_workspace_image_bulk_ai
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 workspace/image/bulk AI parity failed' }

      - name: Qt6 3I.48 owner Filament rejection stage and slider contract
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i48_owner_filament_site_foundation
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 3I.48 owner contract failed' }

      - name: Mature acquisition regressions
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_epic49_phase49_3i16_resilient_acquisition tests.test_phase49_3i38_crawl_ledger_stage_ai tests.test_phase49_3i43_modern_acquisition_intelligence tests.test_phase49_3i45_incremental_discovery_intelligence
          if ($LASTEXITCODE -ne 0) { throw 'Mature acquisition regression failed' }

      - name: Mature Filament Library regression
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i41_filament_library
          if ($LASTEXITCODE -ne 0) { throw 'Phase49.3I.41 regression failed' }

      - name: Mature Profile Commerce and Stage regressions
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i34_profile_matrix tests.test_phase49_3i35_operator_workflow tests.test_phase49_3i36_stage_finalization tests.test_phase49_3i37_seven_stage_ai tests.test_phase49_3i39_professional_commerce
          if ($LASTEXITCODE -ne 0) { throw 'Mature Profile/Stage regression failed' }

      - name: Single Active AI regression
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_epic49_phase49_3i17_single_active_ai_runtime
          if ($LASTEXITCODE -ne 0) { throw 'Single Active AI regression failed' }

      - name: Qt6 offscreen structural launch
        shell: pwsh
        working-directory: catalog_center
        run: |
          $env:CATALOG_DATA_ROOT = Join-Path $env:RUNNER_TEMP "catalog-center-data"
          python qt_launch.py --verify-only | Tee-Object -FilePath "$env:RUNNER_TEMP/qt6-verify.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Qt6 verify-only launch failed' }
          $text = Get-Content "$env:RUNNER_TEMP/qt6-verify.txt" -Raw
          foreach ($marker in @(
            'QT_UI_CONTRACT=phase49-3i42c3-ai-crawl-parity-v2',
            'QT6_MAIN_WINDOW=ENABLED',
            'QT6_PRODUCT_GALLERY_SORT=ENABLED',
            'QT6_FILAMENT_CRUD=ENABLED',
            'QT6_PROFILE_MATRIX=ENABLED',
            'QT6_IMAGE_DIMENSION_SIZE_SEO=ENABLED',
            'QT6_CONTENT_SEO_EDITOR=ENABLED',
            'QT6_SOURCE_LICENSE_SPECS=ENABLED',
            'QT6_HOMEPAGE_SLIDER_EDITOR=ENABLED',
            'QT6_STAGE_TRISTATE=ENABLED',
            'QT6_AI_SOURCE_MODES=ENABLED',
            'QT6_AI_PROVIDER_HUB=ENABLED',
            'QT6_SITE_CONNECTION_SETTINGS=ENABLED',
            'QT6_SINGLE_AI_CORE=ENABLED',
            'QT6_PRODUCT_ACQUISITION_ROUTE=ENABLED',
            'QT6_LEGACY_CRAWL_CONTROLS=ENABLED',
            'QT6_AI_MODEL_RANKING_COST=ENABLED',
            'QT6_AI_STRUCTURED_PROBE=ENABLED',
            'QT6_AI_COST_CONFIRM=ENABLED',
            'QT6_DIAGNOSTIC_DIALOG=ENABLED',
            'QT6_OPENROUTER_JSON_MODE=ENABLED',
            'QT6_SEMANTIC_TRANSLATION_GUARD=ENABLED',
            'QT6_IMAGE_FINAL_WEBP_PARITY=ENABLED',
            'QT6_PERSISTENT_CRAWL_INVENTORY=ENABLED',
            'QT6_PRODUCT_LIFECYCLE_BULK_ACTIONS=ENABLED',
            'QT6_PRODUCT_STATUS_BORDER_SEO=ENABLED',
            'QT6_SLIDER_DIRECT_INPUT_UX=ENABLED',
            'QT6_42B2_FULL_PARITY_VERIFY=OK'
          )) {
            if ($text -notmatch [regex]::Escape($marker)) {
              throw "Missing Qt6 marker: $marker"
            }
          }

      - name: Legacy launcher remains healthy
        shell: pwsh
        working-directory: catalog_center
        run: |
          python launch.py --verify-only | Tee-Object -FilePath "$env:RUNNER_TEMP/legacy-verify.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Legacy launcher verify failed' }
          $legacy = Get-Content "$env:RUNNER_TEMP/legacy-verify.txt" -Raw
          if ($legacy -notmatch 'ACTIVE_RELEASE_VERIFIED=OK') {
            throw 'Legacy release verification marker missing'
          }

      - name: Final source guards
        shell: pwsh
        run: |
          if (Select-String -Path "catalog_center/qt6/*.py" -Pattern "import tkinter|from tkinter" -Quiet) {
            throw "Qt6 presentation package must not import Tkinter"
          }
          Write-Host "PHASE49_3I42B2_FULL_LEGACY_PARITY_CI=PASS"
          Write-Host "PHASE49_3I42C_FULL_ACQUISITION_CI=PASS"
          Write-Host "PHASE49_3I42C3_AI_CRAWL_PARITY_CI=PASS"
          Write-Host "PHASE49_3I48_OWNER_FILAMENT_SITE_FOUNDATION_CI=PASS"
