name: Phase50 Service and Store Refund Maker Checker CI

on:
  push:
    branches:
      - fix/service-store-refund-dual-approval-20261111
    paths:
      - website/models.py
      - website/admin.py
      - website/service_adjustments.py
      - website/service_adjustment_admin.py
      - website/test_service_financial_adjustments.py
      - website/migrations/0029_refund_maker_checker_approval.py
      - store/models.py
      - store/admin.py
      - store/rma_services.py
      - store/rma_admin.py
      - store/finance_reconciliation.py
      - store/test_phase50_variant_rma.py
      - store/migrations/0044_refund_maker_checker_approval.py
      - scripts/host/phase50_refund_dual_approval_deploy.sh
      - scripts/host/phase50_reverse_tunnel_bootstrap.sh
      - .github/workflows/phase50-refund-dual-approval-ci.yml
  workflow_dispatch:

# CI must never receive production SSH/FTPS/cPanel or payment-provider secrets.
permissions:
  contents: read

concurrency:
  group: refund-dual-approval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refund-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: phase50-refund-approval-ci-only-not-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      PAYMENT_GATEWAY_ENABLED: "0"
      ZARINPAL_SANDBOX: "0"
      ZARINPAL_MERCHANT_ID: ""
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install isolated test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate Python and guarded host scripts
        run: |
          python -m py_compile \
            website/models.py website/admin.py website/service_adjustments.py \
            website/service_adjustment_admin.py website/test_service_financial_adjustments.py \
            store/models.py store/admin.py store/rma_services.py store/rma_admin.py \
            store/finance_reconciliation.py store/test_phase50_variant_rma.py \
            website/migrations/0029_refund_maker_checker_approval.py \
            store/migrations/0044_refund_maker_checker_approval.py
          bash -n scripts/host/phase50_reverse_tunnel_bootstrap.sh
          bash -n scripts/host/phase50_refund_dual_approval_deploy.sh

      - name: Django configuration and zero schema drift
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run --noinput

      - name: Exact two-migration reviewer permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          service = Path("website/migrations/0029_refund_maker_checker_approval.py").read_text()
          store = Path("store/migrations/0044_refund_maker_checker_approval.py").read_text()
          assert "approve_servicerefund" in service
          assert "approve_storereturnrefund" in store
          assert "approved_by" in service and "approved_at" in service
          assert "approved_by" in store and "approved_at" in store
          print("DUAL_APPROVAL_MIGRATION_CONTRACT=PASS")
          PY

      - name: Regression and security gates
        run: |
          python manage.py test --noinput --verbosity 1 \
            website.test_service_financial_adjustments \
            store.test_phase50_variant_rma \
            store.test_phase6 \
            store.test_phase7 \
            store.test_phase50_a2s_finance_reconciliation \
            website.test_service_order_cycle \
            website.test_order_admin_finance \
            website.test_phase28_payment \
            website.test_phase30_online_payment \
            website.test_quote_price_snapshot \
            website.test_quote_time_basis \
            website.test_order_image_preview \
            website.tests

      - name: Diff hygiene
        run: git diff --check
