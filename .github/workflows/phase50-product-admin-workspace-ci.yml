name: Phase50 Product Admin Workspace CI

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - store/apps.py
      - store/admin.py
      - store/admin_seo.py
      - store/phase39_admin.py
      - store/phase39_models.py
      - store/phase50_profile_matrix.py
      - store/phase50_variant_views.py
      - store/test_phase50_profile_matrix.py
      - store/test_phase50_filament_offer_operations.py
      - store/test_phase49_3i51_filament_registry_admin.py
      - catalog_bridge/unified_views.py
      - catalog_bridge/views.py
      - catalog_bridge/urls.py
      - catalog_bridge/publish_readiness.py
      - catalog_bridge/tests/test_phase49_3i53_publish_readiness.py
      - catalog_center/app/site_connection.py
      - catalog_center/app/phase49_3i49_site_publish.py
      - scripts/host/phase49_3i53_production_readonly_audit.sh
      - scripts/host/phase49_3i53_production_deploy.sh
      - scripts/host/phase49_3i53_mysql_backup.py
      - catalog_bridge/tests/test_phase49_3i41_filament_bridge.py
      - catalog_center/app/epic49_site_sync.py
      - store/phase49_3i49_admin_control.py
      - store/phase49_3i52_site_authoring_ai.py
      - store/phase49_3i52_site_identity.py
      - store/management/commands/phase37_import_catalog_center.py
      - store/test_phase49_3i52_site_authoring_ai.py
      - store/test_phase49_3i52b_bidirectional_sync.py
      - ai/**
      - website/phase49_3i49_admin_control.py
      - website/apps.py
      - store/apps.py
      - store/test_phase49_3i49_site_publish_admin_sync.py
      - templates/store/product_detail.html
      - static/store/js/phase50-profile-selector.js
      - website/admin.py
      - website/models.py
      - website/migrations/0024_phase49_3i51_material_catalog_description.py
      - store/migrations/0042_phase49_3i51_filament_registry_descriptions.py
      - store/phase50_product_admin_workspace.py
      - store/test_phase50_product_admin_workspace.py
      - store/test_phase50_admin_http_regression.py
      - store/phase50_sales_profile_admin.py
      - store/phase50_sales_profiles.py
      - store/phase50_variant_admin.py
      - store/phase50_variant2.py
      - store/phase50_filament_offer.py
      - store/migrations/0041_phase50_filament_visual_identity.py
      - store/epic49_catalog_admin.py
      - website/templatetags/admin_console.py
      - templates/admin/**
      - static/admin/**
      - .github/workflows/phase50-product-admin-workspace-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-admin-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: phase50-product-admin-ci-only-not-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile touched Python surfaces
        run: |
          python -m py_compile \
            scripts/host/phase49_3i53_mysql_backup.py \
            store/apps.py \
            store/admin.py \
            store/admin_seo.py \
            store/phase39_admin.py \
            store/phase39_models.py \
            store/phase50_profile_matrix.py \
            store/phase50_variant_views.py \
            catalog_bridge/unified_views.py \
            catalog_bridge/views.py \
            catalog_bridge/urls.py \
            catalog_bridge/publish_readiness.py \
            catalog_bridge/tests/test_phase49_3i53_publish_readiness.py \
            catalog_center/app/site_connection.py \
            catalog_center/app/phase49_3i49_site_publish.py \
            catalog_bridge/tests/test_phase49_3i41_filament_bridge.py \
            catalog_center/app/epic49_site_sync.py \
            store/phase49_3i49_admin_control.py \
            store/phase49_3i52_site_authoring_ai.py \
            store/phase49_3i52_site_identity.py \
            store/management/commands/phase37_import_catalog_center.py \
            store/test_phase49_3i52_site_authoring_ai.py \
            store/test_phase49_3i52b_bidirectional_sync.py \
            ai/model_policy.py \
            ai/product_content.py \
            website/phase49_3i49_admin_control.py \
            website/apps.py \
            store/apps.py \
            store/test_phase49_3i49_site_publish_admin_sync.py \
            website/admin.py \
            website/models.py \
            website/migrations/0024_phase49_3i51_material_catalog_description.py \
            store/migrations/0042_phase49_3i51_filament_registry_descriptions.py \
            store/phase50_product_admin_workspace.py \
            store/phase50_filament_offer.py \
            store/migrations/0041_phase50_filament_visual_identity.py \
            store/test_phase50_product_admin_workspace.py \
            store/test_phase50_admin_http_regression.py \
            store/test_phase50_profile_matrix.py \
            store/test_phase50_filament_offer_operations.py \
            store/test_phase49_3i51_filament_registry_admin.py \
            website/templatetags/admin_console.py

      - name: Validate Admin console JavaScript
        run: |
          node --check static/admin/master-django.js
          node --check static/admin/phase50-admin-console-v2.js
          node --check static/admin/phase49-admin-tabs.js

      - name: Validate Production read-only audit script
        run: |
          bash -n scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F "NO FETCH / NO MERGE / NO MIGRATE / NO COLLECTSTATIC / NO RESTART" scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F "PHASE49_3I53_PRODUCTION_READONLY_AUDIT=PASS" scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F 'EXPECTED_PROD_HEAD="${2:-}"' scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F 'expected_production_head_required' scripts/host/phase49_3i53_production_readonly_audit.sh
          bash -n scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'PREDEPLOY_BACKUP_VERIFIED=YES' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'git merge --ff-only "$FETCHED"' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'PHASE49_3I53C_PRODUCTION_DEPLOY=PASS' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'phase49_3i53_mysql_backup.py' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'PHASE49_PROJECT_ROOT="$ROOT"' scripts/host/phase49_3i53_production_deploy.sh
          python scripts/host/phase49_3i53_mysql_backup.py --self-test

      - name: Django system check
        run: python manage.py check

      - name: Migration state must match runtime models
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations in CI SQLite
        run: python manage.py migrate --noinput

      - name: Unified Product Admin regressions
        run: |
          python manage.py test \
            store.test_phase50_product_admin_workspace \
            store.test_phase50_admin_http_regression \
            store.test_phase50_profile_matrix \
            store.test_phase50_filament_offer_operations \
            store.test_phase49_3i49_site_publish_admin_sync \
            store.test_phase49_3i51_filament_registry_admin \
            store.test_phase49_3i52_site_authoring_ai \
            store.test_phase49_3i52b_bidirectional_sync \
            catalog_bridge.tests.test_phase49_3i41_filament_bridge \
            catalog_bridge.tests.test_phase49_3i53_publish_readiness \
            -v 2

      - name: Gate marker
        run: |
          echo "PHASE50_PRODUCT_ADMIN_WORKSPACE_CI=PASS"
          echo "PHASE50_FILAMENT_ADMIN_0041_CI=PASS"
          echo "PHASE49_3I51_FILAMENT_REGISTRY_ADMIN_CI=PASS"
          echo "PHASE49_3I51_FILAMENT_BRIDGE_V3_CI=PASS"
          echo "PHASE49_3I51_MIGRATIONS_0024_0042_CI=PASS"
          echo "PHASE49_3I52_SITE_AUTHORING_AI_CI=PASS"
          echo "PHASE49_3I52B_BIDIRECTIONAL_SITE_SYNC_CI=PASS"
          echo "PHASE49_3I53_SITE_PUBLISH_READINESS_CI=PASS"
          echo "COMMIT=$GITHUB_SHA"
