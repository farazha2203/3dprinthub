name: Phase50 Product Admin Workspace CI

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - store/apps.py
      - store/admin.py
      - store/admin_seo.py
      - store/phase39_admin.py
      - store/phase39_models.py
      - store/phase50_profile_matrix.py
      - store/phase50_variant_views.py
      - store/test_phase50_profile_matrix.py
      - store/test_phase50_filament_offer_operations.py
      - store/test_phase49_3i51_filament_registry_admin.py
      - catalog_bridge/unified_views.py
      - catalog_bridge/views.py
      - catalog_bridge/urls.py
      - catalog_bridge/publish_readiness.py
      - catalog_bridge/tests/test_phase49_3i53_publish_readiness.py
      - catalog_center/app/site_connection.py
      - catalog_center/app/phase49_3i49_site_publish.py
      - scripts/host/phase49_3i53_production_readonly_audit.sh
      - scripts/host/phase49_3i53_production_deploy.sh
      - scripts/host/phase49_3i53_mysql_backup.py
      - scripts/host/phase49_3i53_postmerge_resume.sh
      - store/test_phase49_3i53_host_ai_import_safety.py
      - catalog_bridge/tests/test_phase49_3i41_filament_bridge.py
      - catalog_center/app/epic49_site_sync.py
      - store/phase49_3i49_admin_control.py
      - store/phase49_3i52_site_authoring_ai.py
      - store/phase49_3i52_site_identity.py
      - store/management/commands/phase37_import_catalog_center.py
      - store/test_phase49_3i52_site_authoring_ai.py
      - store/test_phase49_3i52b_bidirectional_sync.py
      - ai/**
      - website/phase49_3i49_admin_control.py
      - website/apps.py
      - store/apps.py
      - store/test_phase49_3i49_site_publish_admin_sync.py
      - templates/store/product_detail.html
      - static/store/js/phase50-profile-selector.js
      - website/admin.py
      - website/models.py
      - website/migrations/0024_phase49_3i51_material_catalog_description.py
      - store/migrations/0042_phase49_3i51_filament_registry_descriptions.py
      - store/phase50_product_admin_workspace.py
      - store/test_phase50_product_admin_workspace.py
      - store/test_phase50_admin_http_regression.py
      - store/phase50_sales_profile_admin.py
      - store/phase50_sales_profiles.py
      - store/phase50_variant_admin.py
      - store/phase50_variant2.py
      - store/phase50_filament_offer.py
      - store/migrations/0039_phase50_filament_offer_pricing.py
      - store/migrations/0041_phase50_filament_visual_identity.py
      - scripts/host/phase49_3i53_partial_0039_resume.sh
      - store/test_phase49_3i53_mysql_partial_migration.py
      - store/epic49_catalog_admin.py
      - website/templatetags/admin_console.py
      - templates/admin/**
      - static/admin/**
      - .github/workflows/phase50-product-admin-workspace-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-admin-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: phase50-product-admin-ci-only-not-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile touched Python surfaces
        run: |
          python -m py_compile \
            scripts/host/phase49_3i53_mysql_backup.py \
            store/migrations/0039_phase50_filament_offer_pricing.py \
            store/test_phase49_3i53_mysql_partial_migration.py \
            store/test_phase49_3i53_host_ai_import_safety.py \
            store/apps.py \
            store/admin.py \
            store/admin_seo.py \
            store/phase39_admin.py \
            store/phase39_models.py \
            store/phase50_profile_matrix.py \
            store/phase50_variant_views.py \
            catalog_bridge/unified_views.py \
            catalog_bridge/views.py \
            catalog_bridge/urls.py \
            catalog_bridge/publish_readiness.py \
            catalog_bridge/tests/test_phase49_3i53_publish_readiness.py \
            catalog_center/app/site_connection.py \
            catalog_center/app/phase49_3i49_site_publish.py \
            catalog_bridge/tests/test_phase49_3i41_filament_bridge.py \
            catalog_center/app/epic49_site_sync.py \
            store/phase49_3i49_admin_control.py \
            store/phase49_3i52_site_authoring_ai.py \
            store/phase49_3i52_site_identity.py \
            store/management/commands/phase37_import_catalog_center.py \
            store/test_phase49_3i52_site_authoring_ai.py \
            store/test_phase49_3i52b_bidirectional_sync.py \
            ai/model_policy.py \
            ai/product_content.py \
            website/phase49_3i49_admin_control.py \
            website/apps.py \
            store/apps.py \
            store/test_phase49_3i49_site_publish_admin_sync.py \
            website/admin.py \
            website/models.py \
            website/migrations/0024_phase49_3i51_material_catalog_description.py \
            store/migrations/0042_phase49_3i51_filament_registry_descriptions.py \
            store/phase50_product_admin_workspace.py \
            store/phase50_filament_offer.py \
            store/migrations/0041_phase50_filament_visual_identity.py \
            store/test_phase50_product_admin_workspace.py \
            store/test_phase50_admin_http_regression.py \
            store/test_phase50_profile_matrix.py \
            store/test_phase50_filament_offer_operations.py \
            store/test_phase49_3i51_filament_registry_admin.py \
            website/templatetags/admin_console.py

      - name: Validate Admin console JavaScript
        run: |
          node --check static/admin/master-django.js
          node --check static/admin/phase50-admin-console-v2.js
          node --check static/admin/phase49-admin-tabs.js

      - name: Validate Production read-only audit script
        run: |
          bash -n scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F "NO FETCH / NO MERGE / NO MIGRATE / NO COLLECTSTATIC / NO RESTART" scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F "PHASE49_3I53_PRODUCTION_READONLY_AUDIT=PASS" scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F 'EXPECTED_PROD_HEAD="${2:-}"' scripts/host/phase49_3i53_production_readonly_audit.sh
          grep -F 'expected_production_head_required' scripts/host/phase49_3i53_production_readonly_audit.sh
          bash -n scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'PREDEPLOY_BACKUP_VERIFIED=YES' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'git merge --ff-only "$FETCHED"' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'PHASE49_3I53C_PRODUCTION_DEPLOY=PASS' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'phase49_3i53_mysql_backup.py' scripts/host/phase49_3i53_production_deploy.sh
          grep -F 'PHASE49_PROJECT_ROOT="$ROOT"' scripts/host/phase49_3i53_production_deploy.sh
          python scripts/host/phase49_3i53_mysql_backup.py --self-test
          bash -n scripts/host/phase49_3i53_postmerge_resume.sh
          bash -n scripts/host/phase49_3i53_partial_0039_resume.sh
          grep -F 'PARTIAL_0039_FORENSICS=PASS' scripts/host/phase49_3i53_partial_0039_resume.sh
          grep -F 'PARTIAL_STATE_DB_BACKUP_VERIFIED=YES' scripts/host/phase49_3i53_partial_0039_resume.sh
          grep -F 'PHASE49_3I53G_PARTIAL_MIGRATION_RECOVERY=PASS' scripts/host/phase49_3i53_partial_0039_resume.sh
          grep -F 'PRE_MIGRATION_ROLLBACK_REVERIFIED=YES' scripts/host/phase49_3i53_postmerge_resume.sh
          grep -F 'DJANGO_BOOT_SAFE_BEFORE_HTTPX=YES' scripts/host/phase49_3i53_postmerge_resume.sh
          grep -F 'FRESH_PRE_MIGRATION_DB_BACKUP_VERIFIED=YES' scripts/host/phase49_3i53_postmerge_resume.sh
          grep -F 'PHASE49_3I53F_POSTMERGE_RECOVERY=PASS' scripts/host/phase49_3i53_postmerge_resume.sh
          grep -F 'TARGET_DEPENDENCIES_READY=YES' scripts/host/phase49_3i53_production_deploy.sh

      - name: Django system check
        run: python manage.py check

      - name: Migration state must match runtime models
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations in CI SQLite
        run: python manage.py migrate --noinput

      - name: Unified Product Admin regressions
        run: |
          python manage.py test \
            store.test_phase50_product_admin_workspace \
            store.test_phase50_admin_http_regression \
            store.test_phase50_profile_matrix \
            store.test_phase50_filament_offer_operations \
            store.test_phase49_3i49_site_publish_admin_sync \
            store.test_phase49_3i51_filament_registry_admin \
            store.test_phase49_3i52_site_authoring_ai \
            store.test_phase49_3i52b_bidirectional_sync \
            store.test_phase49_3i53_host_ai_import_safety \
            store.test_phase49_3i53_mysql_partial_migration \
            catalog_bridge.tests.test_phase49_3i41_filament_bridge \
            catalog_bridge.tests.test_phase49_3i53_publish_readiness \
            -v 2

      - name: Gate marker
        run: |
          echo "PHASE50_PRODUCT_ADMIN_WORKSPACE_CI=PASS"
          echo "PHASE50_FILAMENT_ADMIN_0041_CI=PASS"
          echo "PHASE49_3I51_FILAMENT_REGISTRY_ADMIN_CI=PASS"
          echo "PHASE49_3I51_FILAMENT_BRIDGE_V3_CI=PASS"
          echo "PHASE49_3I51_MIGRATIONS_0024_0042_CI=PASS"
          echo "PHASE49_3I52_SITE_AUTHORING_AI_CI=PASS"
          echo "PHASE49_3I52B_BIDIRECTIONAL_SITE_SYNC_CI=PASS"
          echo "PHASE49_3I53_SITE_PUBLISH_READINESS_CI=PASS"
          echo "PHASE49_3I53F_HOST_AI_IMPORT_SAFETY_CI=PASS"
          echo "PHASE49_3I53G_MYSQL_PARTIAL_MIGRATION_CI=PASS"
          echo "COMMIT=$GITHUB_SHA"

  mysql-migration-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci_3dprinthub
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: phase50-mysql-migration-ci-only-not-production
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_ENGINE: django.db.backends.mysql
      DB_NAME: ci_3dprinthub
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
    steps:
      - name: Checkout exact snapshot
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: MySQL Store/Website migration chain from zero
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate store 0042_phase49_3i51_filament_registry_descriptions --noinput
          python manage.py migrate website 0024_phase49_3i51_material_catalog_description --noinput
          python manage.py showmigrations store website
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.db import connection
          from django.db.migrations.recorder import MigrationRecorder
          required = {
              ("store", "0039_phase50_filament_offer_pricing"),
              ("store", "0040_phase50_filament_offer_operations"),
              ("store", "0041_phase50_filament_visual_identity"),
              ("store", "0042_phase49_3i51_filament_registry_descriptions"),
              ("website", "0024_phase49_3i51_material_catalog_description"),
          }
          applied = set(
              MigrationRecorder.Migration.objects.filter(
                  app__in={"store", "website"}
              ).values_list("app", "name")
          )
          missing = sorted(required - applied)
          print("MYSQL_REQUIRED_MIGRATIONS_MISSING=" + repr(missing))
          if connection.vendor != "mysql":
              raise SystemExit("MYSQL_MIGRATION_CI=FAIL:vendor")
          if missing:
              raise SystemExit("MYSQL_MIGRATION_CI=FAIL:missing")
          print("MYSQL_STORE_WEBSITE_MIGRATION_FROM_ZERO=PASS")
          PY

      - name: Recreate MySQL database for partial 0039 recovery simulation
        run: |
          python - <<'PY'
          import os
          import pymysql

          conn = pymysql.connect(
              host=os.environ["DB_HOST"],
              port=int(os.environ["DB_PORT"]),
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              autocommit=True,
          )
          db = os.environ["DB_NAME"]
          with conn.cursor() as cursor:
              cursor.execute(f"DROP DATABASE IF EXISTS \`{db}\`")
              cursor.execute(
                  f"CREATE DATABASE \`{db}\` "
                  "CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
              )
          conn.close()
          print("MYSQL_PARTIAL_SIM_DATABASE_RESET=PASS")
          PY

      - name: Simulate Production partial 0039 and recover on MySQL
        run: |
          python manage.py migrate store 0038_phase50_profile_matrix --noinput
          python manage.py migrate website 0024_phase49_3i51_material_catalog_description --noinput
          python - <<'PY'
          import importlib
          import os

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()

          from django.db import connection
          from store.phase39_models import MaterialColorOption

          module = importlib.import_module(
              "store.migrations.0039_phase50_filament_offer_pricing"
          )
          names = [
              "brand_name",
              "manufacturer_name",
              "roll_weight_grams",
              "stock_roll_count_snapshot",
              "purchase_price_per_roll",
              "sale_price_per_roll",
              "usd_price_per_roll",
              "usd_fx_rate_toman",
          ]
          with connection.schema_editor() as schema_editor:
              for name in names:
                  field = MaterialColorOption._meta.get_field(name)
                  schema_editor.add_field(MaterialColorOption, field)
          print("MYSQL_PARTIAL_0039_PREFIX_SIMULATED=PASS")
          PY
          python manage.py migrate store 0042_phase49_3i51_filament_registry_descriptions --noinput
          python - <<'PY'
          import os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()

          from django.db import connection
          from django.db.migrations.recorder import MigrationRecorder
          from store.models import ProductVariant, StoreOrderItem
          from store.phase39_models import MaterialColorOption

          required = {
              ("store", "0039_phase50_filament_offer_pricing"),
              ("store", "0040_phase50_filament_offer_operations"),
              ("store", "0041_phase50_filament_visual_identity"),
              ("store", "0042_phase49_3i51_filament_registry_descriptions"),
              ("website", "0024_phase49_3i51_material_catalog_description"),
          }
          applied = set(
              MigrationRecorder.Migration.objects.filter(
                  app__in={"store", "website"}
              ).values_list("app", "name")
          )
          missing = sorted(required - applied)

          def columns(model):
              with connection.cursor() as cursor:
                  desc = connection.introspection.get_table_description(
                      cursor,
                      model._meta.db_table,
                  )
              return {str(item.name) for item in desc}

          material = columns(MaterialColorOption)
          variant = columns(ProductVariant)
          order = columns(StoreOrderItem)
          required_material = {
              "brand_name",
              "manufacturer_name",
              "roll_weight_grams",
              "stock_roll_count_snapshot",
              "purchase_price_per_roll",
              "sale_price_per_roll",
              "usd_price_per_roll",
              "usd_fx_rate_toman",
              "print_hourly_rate",
              "color_finish",
              "description",
          }
          required_order = {
              "support_weight_grams",
              "filament_brand_name",
              "filament_manufacturer_name",
          }

          print("MYSQL_PARTIAL_RECOVERY_MIGRATIONS_MISSING=" + repr(missing))
          print(
              "MYSQL_PARTIAL_RECOVERY_MATERIAL_MISSING="
              + repr(sorted(required_material - material))
          )
          print(
              "MYSQL_PARTIAL_RECOVERY_ORDER_MISSING="
              + repr(sorted(required_order - order))
          )
          print(
              "MYSQL_PARTIAL_RECOVERY_VARIANT_SUPPORT="
              + repr("support_weight_grams" in variant)
          )

          if missing:
              raise SystemExit("MYSQL_PARTIAL_RECOVERY_CI=FAIL:migrations")
          if required_material - material:
              raise SystemExit("MYSQL_PARTIAL_RECOVERY_CI=FAIL:material")
          if required_order - order:
              raise SystemExit("MYSQL_PARTIAL_RECOVERY_CI=FAIL:order")
          if "support_weight_grams" not in variant:
              raise SystemExit("MYSQL_PARTIAL_RECOVERY_CI=FAIL:variant")
          print("MYSQL_PARTIAL_0039_RECOVERY_CI=PASS")
          PY

