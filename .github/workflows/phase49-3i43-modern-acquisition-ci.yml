name: Phase49.3I.43 Modern Acquisition Intelligence CI

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - "catalog_center/app/phase49_3i43_modern_acquisition_intelligence.py"
      - "catalog_center/app/page_extractor.py"
      - "catalog_center/app/db.py"
      - "catalog_center/app/version.py"
      - "catalog_center/config.example.json"
      - "catalog_center/requirements.txt"
      - "catalog_center/launch.py"
      - "catalog_center/tests/test_phase49_3i43_modern_acquisition_intelligence.py"
      - "catalog_center/tests/test_epic49_phase49_3i16_resilient_acquisition.py"
      - "catalog_center/tests/test_phase49_3i38_crawl_ledger_stage_ai.py"
      - ".github/workflows/phase49-3i43-modern-acquisition-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modern-acquisition-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact GitHub snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog_center/requirements.txt

      - name: Install Catalog dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r catalog_center/requirements.txt
          python -c "import httpx, protego; print('HTTPX_VERSION=' + httpx.__version__); print('PROTEGO_IMPORT=OK')"

      - name: Compile acquisition and launcher
        shell: pwsh
        run: |
          python -m compileall -q `
            catalog_center/app/phase49_3i43_modern_acquisition_intelligence.py `
            catalog_center/app/page_extractor.py `
            catalog_center/app/db.py `
            catalog_center/launch.py `
            catalog_center/tests/test_phase49_3i43_modern_acquisition_intelligence.py
          if ($LASTEXITCODE -ne 0) { throw 'Phase49.3I.43 compile failed' }

      - name: Modern acquisition tests
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_3i43_modern_acquisition_intelligence
          if ($LASTEXITCODE -ne 0) { throw 'Phase49.3I.43 tests failed' }

      - name: Mature acquisition regressions
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v `
            tests.test_epic49_phase49_3i16_resilient_acquisition `
            tests.test_phase49_3i38_crawl_ledger_stage_ai
          if ($LASTEXITCODE -ne 0) { throw 'Mature acquisition regression failed' }

      - name: Launcher and version contract
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_v854_launcher
          if ($LASTEXITCODE -ne 0) { throw 'Launcher version contract failed' }
          python launch.py --verify-only | Tee-Object -FilePath "$env:RUNNER_TEMP\phase49-3i43-launch.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher verify failed' }
          $text = Get-Content "$env:RUNNER_TEMP\phase49-3i43-launch.txt" -Raw
          foreach ($marker in @(
            'ACTIVE_VERSION=8.9.9',
            'EPIC49_3I43_MODERN_ACQUISITION_INTELLIGENCE=ENABLED',
            'EPIC49_3I43_CONDITIONAL_HTTP_CACHE=ENABLED',
            'EPIC49_3I43_ROBOTS_RETRY_AFTER_GUARD=ENABLED',
            'EPIC49_3I43_PUBLIC_JSON_ENDPOINT_PROVENANCE=ENABLED',
            'ACTIVE_RELEASE_VERIFIED=OK'
          )) {
            if ($text -notmatch [regex]::Escape($marker)) {
              throw "Missing marker: $marker"
            }
          }

      - name: Policy guard
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -c "import json; c=json.load(open('config.example.json', encoding='utf-8')); a=c['acquisition']; assert a['obey_robots_txt'] is True; assert a['honor_retry_after'] is True; assert a['captcha_bypass'] is False; assert a['authentication_bypass'] is False; assert a['proxy_evasion'] is False; print('ACQUISITION_POLICY_GUARD=PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Acquisition policy guard failed' }
          Write-Host "PHASE49_3I43_MODERN_ACQUISITION_CI=PASS"
