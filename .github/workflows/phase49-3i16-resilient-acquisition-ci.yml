name: Phase49.3I.16 Resilient Acquisition CI

on:
  push:
    branches:
      - epic/phase49-unified-product-slider-sync
      - agent/phase49-3i16-resilient-acquisition-fallback
  pull_request:
    branches:
      - epic/phase49-unified-product-slider-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase49-3i16:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-phase49-3i16-secret-key"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      CATALOG_BRIDGE_TOKEN: "phase49-3i16-ci-token-12345678901234567890"
      MEDIA_ROOT: "/tmp/3dprinthub-3i16/media"
      PRIVATE_MEDIA_ROOT: "/tmp/3dprinthub-3i16/private-media"
      STATIC_ROOT: "/tmp/3dprinthub-3i16/static"
      CATALOG_BRIDGE_PENDING_ROOT: "/tmp/3dprinthub-3i16/imports/pending"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Windows gate contract
        shell: pwsh
        run: |
          $path = "RUN_PHASE49_3I16_FALLBACK_GATE.ps1"
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          $nonAscii = @($bytes | Where-Object { $_ -gt 127 })
          if ($nonAscii.Count -gt 0) { throw "Runner must remain ASCII-only. Non-ASCII bytes: $($nonAscii.Count)" }
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          [void][scriptblock]::Create($text)
          if ($text -notmatch 'RUN_PHASE49_3I15_BULK_GATE\.ps1') { throw "Previous gate chaining missing" }
          if ($text -notmatch 'PHASE49_3I16_DISCOVERY_FALLBACK=LOCATOR_SAFE_CLASSIC_HTTP') { throw "Discovery fallback marker missing" }
          if ($text -notmatch 'PHASE49_3I16_IMAGE_FALLBACK=LOCATOR_HTTP_MATURE_CDP_LISTING') { throw "Image fallback marker missing" }
          if ($text -notmatch 'NO RESET / NO STASH / NO DELETE / NO PRODUCTION') { throw "Safety marker missing" }

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare isolated runtime directories
        run: |
          rm -rf /tmp/3dprinthub-3i16
          mkdir -p "$MEDIA_ROOT" "$PRIVATE_MEDIA_ROOT" "$STATIC_ROOT" "$CATALOG_BRIDGE_PENDING_ROOT"

      - name: Compile Phase49.3I.16 surfaces
        run: |
          python -m compileall -q \
            catalog_center/app/phase49_3i16_resilient_acquisition.py \
            catalog_center/app/phase49_3i12_runtime_bridge.py \
            catalog_center/tests/test_epic49_phase49_3i16_resilient_acquisition.py

      - name: Phase49.3I.16 targeted regression tests
        working-directory: catalog_center
        run: |
          python -m unittest -v \
            tests.test_epic49_phase49_3i16_resilient_acquisition \
            tests.test_epic49_phase49_3i15_staging_guard \
            tests.test_epic49_phase49_3i15_bulk_discovery_images \
            tests.test_epic49_phase49_3i14_legacy_scan_restore \
            tests.test_epic49_phase49_3i13_batch_fetch_paste_recovery \
            tests.test_epic49_phase49_3i12_discovery_image_recovery

      - name: Verify fallback architecture contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("catalog_center/app/phase49_3i16_resilient_acquisition.py").read_text(encoding="utf-8")
          bridge = Path("catalog_center/app/phase49_3i12_runtime_bridge.py").read_text(encoding="utf-8")
          assert "extract_direct_link(" not in text
          assert "evaluate_all(" not in text
          assert '"locator-safe"' in text
          assert '"classic-links"' in text
          assert '"http-html-links"' in text
          assert '"locator-safe-fresh"' in text
          assert '"http-html-parse"' in text
          assert '"mature-classic-dom"' in text
          assert '"attached-chrome-locator"' in text
          assert '"listing-thumbnail"' in text
          assert "acquisition_trace" in text
          assert "discovery_trace" in text
          assert "_install_phase49_3i16_resilient_acquisition()" in bridge
          print("PHASE49_3I16_FALLBACK_CHAIN=OK")
          print("PHASE49_3I16_TRACE=OK")
          print("PHASE49_3I16_NO_RICH_DIRECT=OK")
          PY

      - name: Django no-migration safety
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan
          echo "PHASE49_3I16_DJANGO_MIGRATION=NONE"

      - name: Launcher smoke
        working-directory: catalog_center
        run: |
          python launch.py --verify-only | tee /tmp/phase49-3i16-launch.txt
          grep -F "EPIC49_3I_DISCOVERY_REVIEW_QUEUE=ENABLED" /tmp/phase49-3i16-launch.txt
          grep -F "ACTIVE_RELEASE_VERIFIED=OK" /tmp/phase49-3i16-launch.txt
