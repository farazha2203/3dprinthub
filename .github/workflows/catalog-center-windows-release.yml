name: Catalog Center Windows Portable Release

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - catalog_center/app/version.py
      - catalog_center/app/phase49_3i29_windows_performance_ai.py
      - catalog_center/app/phase49_3i31_smart_link_bulk_ai.py
      - catalog_center/app/phase49_3i35_operator_ledger.py
      - catalog_center/app/phase49_3i35_resilient_ai.py
      - catalog_center/app/phase49_3i35_readiness_review.py
      - catalog_center/app/phase49_3i34_profile_matrix.py
      - catalog_center/app/phase49_3i33_ai_core.py
      - catalog_center/app/phase49_3i33_operator_workflow.py
      - catalog_center/app/phase49_3i32_source_url_guard.py
      - catalog_center/app/phase49_3i_pricing_modes.py
      - catalog_center/app/product_studio.py
      - catalog_center/app/epic49_product_studio.py
      - catalog_center/launch.py
      - catalog_center/portable_entry.py
      - catalog_center/build_portable_exe.py
      - catalog_center/PACKAGE_MANIFEST.json
      - catalog_center/config.example.json
      - catalog_center/requirements.txt
      - catalog_center/tests/**
      - .github/workflows/catalog-center-windows-release.yml
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish GitHub Release after successful build"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  windows-portable-release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact GitHub snapshot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: catalog_center/requirements.txt

      - name: Install Catalog Center build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r catalog_center/requirements.txt
          python -m playwright install chromium

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'catalog_center'); from app.version import APP_VERSION; print(APP_VERSION)"
          $build = python -c "import sys; sys.path.insert(0, 'catalog_center'); from app.version import BUILD_ID; print(BUILD_ID)"
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'APP_VERSION is empty' }
          if ([string]::IsNullOrWhiteSpace($build)) { throw 'BUILD_ID is empty' }
          "CATALOG_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CATALOG_BUILD_ID=$build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CATALOG_VERSION=$version"
          Write-Host "CATALOG_BUILD_ID=$build"
          Write-Host "GIT_SHA=$env:GITHUB_SHA"

      - name: Compile source before packaging
        shell: pwsh
        run: |
          python -m compileall -q catalog_center/app catalog_center/tests catalog_center/launch.py catalog_center/portable_entry.py catalog_center/build_portable_exe.py
          if ($LASTEXITCODE -ne 0) { throw 'compileall failed' }

      - name: Current Phase49 release regression gate
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -m unittest -v `
            tests.test_phase49_3i35_operator_workflow `
            tests.test_phase49_3i34_profile_matrix `
            tests.test_phase49_3i33_operator_workflow `
            tests.test_phase49_3i32_source_url_guard `
            tests.test_phase49_3i31_smart_link_bulk_ai `
            tests.test_epic49_phase49_3i29_windows_performance_ai `
            tests.test_phase49_3i28_exact_link_contract `
            tests.test_phase49_3i27_category_provider_bridge `
            tests.test_phase49_3i26_operator_completion `
            tests.test_phase49_3i25_product_first_workflow `
            tests.test_phase49_3i24_runtime_observability `
            tests.test_phase49_3i23_avalai_chat_contract `
            tests.test_phase49_3i22_tk_thread_bridge `
            tests.test_phase49_3i21_observable_ai_link_refresh `
            tests.test_phase49_3i20_visible_operator_panels `
            tests.test_phase49_3i19_source_identity `
            tests.test_phase49_3i18_operator_editing `
            tests.test_epic49_phase49_3i17_single_active_ai_runtime `
            tests.test_epic49_phase49_3i16_resilient_acquisition `
            tests.test_portable_exe_contract `
            tests.test_v854_launcher `
            tests.test_epic49_operator_workflow `
            tests.test_v871_slider_seo `
            tests.test_persistent_connection_profile `
            tests.test_v85_upgrade
          if ($LASTEXITCODE -ne 0) { throw 'Current release regression gate failed' }

      - name: Launcher final composition verify
        shell: pwsh
        working-directory: catalog_center
        run: |
          python launch.py --verify-only | Tee-Object -FilePath "$env:RUNNER_TEMP\catalog-launch.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher verify failed' }
          $launch = Get-Content "$env:RUNNER_TEMP\catalog-launch.txt" -Raw
          foreach ($marker in @(
            'EPIC49_3I29_PRODUCTS_PAGE_PAGED_48=ENABLED',
            'EPIC49_3I29_DEFERRED_GLOBAL_REFRESH=ENABLED',
            'EPIC49_3I31_SMART_LINK_AI=ENABLED',
            'EPIC49_3I31_BATCH_SELECTED_PRODUCTS_AI=ENABLED',
            'EPIC49_3I31_AI_TITLE_TEXT_ONLY=ENABLED',
            'EPIC49_3I31_AI_SELECTED_IMAGE_SEO=ENABLED',
            'EPIC49_3I33_CONSOLIDATED_PRODUCT_AI=ENABLED',
            'EPIC49_3I33_SCREENSHOT_VISION_AI=ENABLED',
            'EPIC49_3I33_OPERATOR_MATERIAL_COLOR_ONLY=ENABLED',
            'EPIC49_3I33_EXPLICIT_PRODUCTS_REFRESH=ENABLED',
            'EPIC49_3I33_SINGLE_CARD_UPDATE=ENABLED',
            'EPIC49_3I33_IMAGE_FILE_METADATA=ENABLED',
            'EPIC49_3I33_RUNTIME_TELEMETRY=ENABLED',
            'EPIC49_3I34_PROFILE_MATRIX=ENABLED',
            'EPIC49_3I34_PROFILE_CLONE=ENABLED',
            'EPIC49_3I34_SIZE_WEIGHT_DEPENDENCY=ENABLED',
            'EPIC49_3I34_PROFILE_PRICE_AUTHORITY=ENABLED',
            'EPIC49_3I34_DESKTOP_STORE_SYNC=ENABLED',
            'EPIC49_3I35_OPERATOR_LEDGER=ENABLED',
            'EPIC49_3I35_BRAND_AWARE_FILAMENT_OFFERS=ENABLED',
            'EPIC49_3I35_RESILIENT_AI_RETRY_FAILOVER=ENABLED',
            'EPIC49_3I35_MANUAL_SEO_SOURCE_REVIEW=ENABLED',
            'EPIC49_3I35_LOCAL_PROFILE_SNAPSHOT_AUTHORITY=ENABLED',
            'ACTIVE_RELEASE_VERIFIED=OK'
          )) {
            if ($launch -notmatch [regex]::Escape($marker)) { throw "Missing launcher marker: $marker" }
          }

      - name: Verify source URL preservation contract
        shell: pwsh
        working-directory: catalog_center
        run: |
          python -c "from app.phase49_3i32_source_url_guard import resolve_source_url_for_save as r; u='https://example.com/model/1'; assert r(u,'','') == u; assert r(u,u,'https://example.com/model/2').endswith('/2'); print('PHASE49_3I32_SOURCE_URL_GUARD=PASS')"
          if ($LASTEXITCODE -ne 0) { throw 'Source URL preservation contract failed' }

      - name: Build and self-verify one-file EXE
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          python catalog_center/build_portable_exe.py --python $python
          if ($LASTEXITCODE -ne 0) { throw 'Portable EXE build failed' }

      - name: Verify release manifest and SHA256
        shell: pwsh
        run: |
          $release = Join-Path "catalog_center/release" $env:CATALOG_VERSION
          $manifestPath = Join-Path $release "release-manifest.json"
          if (-not (Test-Path $manifestPath)) { throw "Missing manifest: $manifestPath" }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.app_version -ne $env:CATALOG_VERSION) { throw 'Manifest version mismatch' }
          if ($manifest.git_sha -ne $env:GITHUB_SHA) { throw "Manifest SHA mismatch: $($manifest.git_sha) != $env:GITHUB_SHA" }
          if ($manifest.portable_verify.ok -ne $true) { throw 'Portable self verify not OK' }
          if ($manifest.browser_runtime_smoke.ok -ne $true) { throw 'Packaged browser runtime smoke not OK' }
          $exe = Join-Path $release $manifest.versioned_exe
          if (-not (Test-Path $exe)) { throw "Missing EXE: $exe" }
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($actual -ne ([string]$manifest.sha256).ToLowerInvariant()) { throw 'SHA256 mismatch' }
          Write-Host "WINDOWS_PORTABLE_RELEASE_GATE=PASS"
          Write-Host "EXE=$exe"
          Write-Host "SHA256=$actual"
          Write-Host "BROWSER=$($manifest.browser_runtime_smoke.browser)"

      - name: Upload immutable Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3DPrintHub-CatalogCenter-v${{ env.CATALOG_VERSION }}
          path: catalog_center/release/${{ env.CATALOG_VERSION }}/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "catalog-center-v$env:CATALOG_VERSION"
          $release = Join-Path "catalog_center/release" $env:CATALOG_VERSION
          $manifestPath = Join-Path $release "release-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $exe = Join-Path $release $manifest.versioned_exe
          $shaFile = Get-ChildItem $release -Filter "*.sha256" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $shaFile) { throw 'SHA256 sidecar not found' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; leaving immutable release untouched."
            exit 0
          }
          $notes = @"
          3DPrintHub Catalog Center Windows portable release.

          Version: $env:CATALOG_VERSION
          Build: $env:CATALOG_BUILD_ID
          Commit: $env:GITHUB_SHA

          Release gates passed on windows-latest:
          - compileall
          - current Phase49.3I regression suite including 3I.29 performance, 3I.31 smart/batch AI, 3I.32 source URL preservation, 3I.33 consolidated operator workflow, 3I.34 Product Profile Matrix and 3I.35 operator-ledger/resilient-AI contracts
          - final launcher composition verify
          - PyInstaller one-file/windowed build
          - frozen runtime self verification
          - frozen Playwright/browser launch smoke
          - SHA256 verification

          8.9.1 keeps the 8.9.0 Profile Matrix transport, replaces the duplicated profile editor with operator-ledger snapshots, adds weight/time/support production rows, brand-aware filament offers, and observable AI preflight/retry/failover while preserving explicit refresh and source identity guards.

          External source websites are intentionally not release-gating CI dependencies because third-party anti-bot behavior and runner IP policy are outside the application contract. A final live-source employee acceptance smoke remains required before source acquisition is marked fully accepted.
          "@
          gh release create $tag $exe $manifestPath $shaFile --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "3DPrintHub Catalog Center v$env:CATALOG_VERSION" --notes $notes
