name: Web Stable Baseline Release

on:
  push:
    branches:
      - agent/phase49-3i18-operator-bulk-ai-rebuild
    paths:
      - config/release.py
      - .github/workflows/web-stable-baseline-release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-web-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and verify release marker without importing config package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_ENV"
          import importlib.util
          from pathlib import Path

          path = Path("config/release.py").resolve()
          spec = importlib.util.spec_from_file_location("web_release_marker", path)
          if spec is None or spec.loader is None:
              raise SystemExit("Unable to load config/release.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          assert module.WEB_RELEASE_ID
          assert module.WEB_RELEASE_TAG
          assert len(module.WEB_RELEASE_TARGET_SHA) == 40
          assert module.WEB_RELEASE_STATUS == "stable"
          print(f"WEB_RELEASE_ID={module.WEB_RELEASE_ID}")
          print(f"WEB_RELEASE_TAG={module.WEB_RELEASE_TAG}")
          print(f"WEB_RELEASE_TARGET_SHA={module.WEB_RELEASE_TARGET_SHA}")
          PY
          git cat-file -e "${WEB_RELEASE_TARGET_SHA}^{commit}"
          echo "WEB_RELEASE_MARKER=PASS"

      - name: Publish immutable GitHub release marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$WEB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $WEB_RELEASE_TAG already exists; immutable baseline left unchanged."
            exit 0
          fi
          gh release create "$WEB_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$WEB_RELEASE_TARGET_SHA" \
            --title "3DPrintHub Web $WEB_RELEASE_ID Stable" \
            --notes "Stable owner-verified Phase49 web/catalog baseline. Target commit: $WEB_RELEASE_TARGET_SHA. This tag freezes the healthy production web baseline before Phase50 finance/admin development. Production source remains GitHub-only; future development must occur outside the live production worktree and be redeployed from approved GitHub commits."
