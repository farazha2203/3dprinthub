name: Phase49 Epic Unified CI

on:
  push:
    branches:
      - epic/phase49-unified-product-slider-sync
  pull_request:
    branches:
      - epic/phase49-unified-product-slider-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase49-unified:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-epic49-secret-key"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      CATALOG_BRIDGE_TOKEN: "epic49-ci-token-12345678901234567890"
      MEDIA_ROOT: "/tmp/3dprinthub-ci/media"
      PRIVATE_MEDIA_ROOT: "/tmp/3dprinthub-ci/private-media"
      STATIC_ROOT: "/tmp/3dprinthub-ci/static"
      CATALOG_BRIDGE_PENDING_ROOT: "/tmp/3dprinthub-ci/imports/pending"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell runner syntax and array-safety contract
        shell: pwsh
        run: |
          $runner = Get-Content -Raw -Path "RUN_PHASE49_3D_LOCAL_GATE.ps1"
          [void][scriptblock]::Create($runner)

          if ($runner -notmatch '\$RunnerVersion\s*=\s*"49\.3D\.1"') {
            throw "Expected Phase49.3D.1 runner version marker is missing."
          }
          if ($runner -notmatch '\$projectProcesses\s*=\s*@\(') {
            throw "Process pipeline must be normalized to an array with @(...)."
          }
          if ($runner -notmatch 'if\s*\(@\(\$projectProcesses\)\.Count\s*-gt\s*0\)') {
            throw "Process count check must remain array-safe under StrictMode."
          }

          $zero = @($null | Where-Object { $null -ne $_ })
          $one = @("one")
          $many = @("one", "two")
          if ($zero.Count -ne 0) { throw "Zero-result array contract failed." }
          if ($one.Count -ne 1) { throw "Single-result array contract failed." }
          if ($many.Count -ne 2) { throw "Multi-result array contract failed." }
          Write-Host "PHASE49_3D_POWERSHELL_RUNNER_CONTRACT=OK"

          $runner3e = Get-Content -Raw -Path "RUN_PHASE49_3E_LOCAL_GATE.ps1"
          [void][scriptblock]::Create($runner3e)
          if ($runner3e -notmatch '\$RunnerVersion\s*=\s*"49\.3E\.0"') {
            throw "Expected Phase49.3E.0 runner version marker is missing."
          }
          if ($runner3e -notmatch 'RUN_PHASE49_3D_LOCAL_GATE\.ps1') {
            throw "Phase49.3E runner must chain the canonical Phase49.3D base gate."
          }
          if ($runner3e -notmatch 'EPIC49_3E_AI_TASK_CENTER=ENABLED') {
            throw "Phase49.3E launcher marker contract is missing from the runner."
          }
          Write-Host "PHASE49_3E_POWERSHELL_RUNNER_CONTRACT=OK"

          $runner3f = Get-Content -Raw -Path "RUN_PHASE49_3F_LOCAL_GATE.ps1"
          [void][scriptblock]::Create($runner3f)
          if ($runner3f -notmatch '\$RunnerVersion\s*=\s*"49\.3F\.1"') {
            throw "Expected Phase49.3F.1 runner version marker is missing."
          }
          if ($runner3f -notmatch 'function\s+Invoke-NativeCapture') {
            throw "Phase49.3F.1 native capture helper is missing."
          }
          if ($runner3f -match '\(&\s+\$Py\s+manage\.py\s+showmigrations\s+store\s+2>&1\)') {
            throw "Unsafe direct showmigrations stderr capture returned."
          }
          if ($runner3f -notmatch 'Invoke-NativeCapture\s+-File\s+\$Py\s+-Arguments\s+@\("manage\.py",\s*"showmigrations",\s*"store"\)') {
            throw "Store showmigrations must use Invoke-NativeCapture."
          }
          if ($runner3f -notmatch 'Invoke-NativeCapture\s+-File\s+\$Py\s+-Arguments\s+@\("manage\.py",\s*"showmigrations",\s*"website"\)') {
            throw "Website showmigrations must use Invoke-NativeCapture."
          }
          if ($runner3f -notmatch 'RUN_PHASE49_3E_LOCAL_GATE\.ps1') {
            throw "Phase49.3F runner must chain the canonical Phase49.3E base gate."
          }
          if ($runner3f -notmatch '0033_phase49_3f_pricing_intelligence') {
            throw "Phase49.3F store migration gate is missing."
          }
          if ($runner3f -notmatch '0023_phase49_3f_material_runtime_rates') {
            throw "Phase49.3F material-rate migration gate is missing."
          }
          if ($runner3f -notmatch 'EPIC49_3F_SELECTED_IMAGE_TEXT_ONLY_AI=ENABLED') {
            throw "Phase49.3F image privacy launcher marker is missing from runner."
          }
          if ($runner3f -notmatch 'Production\s*=\s*UNTOUCHED') {
            throw "Phase49.3F runner must explicitly preserve Production."
          }

          & ./RUN_PHASE49_3F_LOCAL_GATE.ps1 -NativeCaptureSelfTest
          if ($LASTEXITCODE -ne 0) {
            throw "Phase49.3F.1 native capture self-test failed."
          }
          Write-Host "PHASE49_3F_POWERSHELL_RUNNER_CONTRACT=OK"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare isolated CI runtime directories
        run: |
          rm -rf /tmp/3dprinthub-ci
          mkdir -p "$MEDIA_ROOT" "$PRIVATE_MEDIA_ROOT" "$STATIC_ROOT" "$CATALOG_BRIDGE_PENDING_ROOT"

      - name: Compile changed Python surfaces
        run: |
          python -m compileall -q \
            store/epic49_catalog_profile.py \
            store/phase49_unified_sync.py \
            store/phase49_persian_sales_copy.py \
            store/phase49_persian_sales_runtime.py \
            store/phase49_3b_profile_media.py \
            store/phase49_3b_hero_media_sync.py \
            store/phase49_3f_pricing.py \
            store/phase49_3f_pricing_finalize.py \
            store/phase49_3f_admin.py \
            store/epic49_catalog_admin.py \
            catalog_bridge \
            website/phase49_unified_sync.py \
            website/phase49_persian_sales_hero.py \
            website/phase49_3b_hero_media.py \
            website/phase49_3b_profile_media_mirror.py \
            website/management/commands/phase49_repair_persian_sales_hero.py \
            catalog_center/app/epic49_desktop_schema.py \
            catalog_center/app/epic49_site_sync.py \
            catalog_center/app/epic49_server_slider_manager.py \
            catalog_center/app/phase49_persian_sales_desktop.py \
            catalog_center/app/phase49_readiness_wizard.py \
            catalog_center/app/phase49_diagnostics.py \
            catalog_center/app/phase49_diagnostics_ui.py \
            catalog_center/app/phase49_diagnostics_identity.py \
            catalog_center/app/phase49_diagnostics_identity_ui.py \
            catalog_center/app/phase49_ai_provider_hub.py \
            catalog_center/app/phase49_3b_ai_product_runtime.py \
            catalog_center/app/phase49_3b_ai_runtime_patch.py \
            catalog_center/app/phase49_3b_guided_wizard.py \
            catalog_center/app/phase49_3b_server_slider_media.py \
            catalog_center/app/phase49_3c_ai_recovery.py \
            catalog_center/app/phase49_3c_image_pipeline.py \
            catalog_center/app/phase49_3c_operator_recovery.py \
            catalog_center/app/phase49_3c_persian_content.py \
            catalog_center/app/phase49_3c_persian_translate_guard.py \
            catalog_center/app/phase49_3d_image_signature.py \
            catalog_center/app/phase49_3d_workflow_hardening.py \
            catalog_center/app/phase49_3d_ai_ui_cleanup.py \
            catalog_center/app/phase49_3e_ai_task_center.py \
            catalog_center/app/phase49_3e_ai_contract.py \
            catalog_center/app/phase49_3f_gemini_provider.py \
            catalog_center/app/phase49_3f_ai_experience.py \
            catalog_center/app/phase49_3f_selected_image_ai.py \
            catalog_center/app/phase49_3f_product_intelligence.py \
            catalog_center/app/phase49_3f_runtime_trace.py \
            catalog_center/app/phase49_3f_workspace.py \
            catalog_center/app/phase49_3f_source_refresh_guard.py \
            catalog_center/app/runtime_logging.py \
            catalog_center/app/openai_content.py \
            catalog_center/app/ai_providers.py \
            catalog_center/app/product_workspace_epic49.py \
            catalog_center/launch.py \
            catalog_center/portable_entry.py

      - name: Django checks and migration contract
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --plan

      - name: Phase49.3F migration files are additive only
        run: |
          python - <<'PY'
          from importlib import import_module
          forbidden = {"DeleteModel", "RemoveField", "RunSQL", "RunPython", "SeparateDatabaseAndState"}
          modules = [
              import_module("store.migrations.0033_phase49_3f_pricing_intelligence"),
              import_module("website.migrations.0023_phase49_3f_material_runtime_rates"),
          ]
          names = {type(op).__name__ for module in modules for op in module.Migration.operations}
          assert names == {"AddField"}, names
          assert names.isdisjoint(forbidden), names & forbidden
          print("PHASE49_3F_MIGRATION_SAFETY=ADD_FIELD_ONLY")
          PY

      - name: Phase49 unified behavioral and regression tests
        run: |
          python manage.py test \
            store.test_phase49_unified_sync \
            store.test_phase49_unified_import_e2e \
            store.test_epic49_operator_publish \
            store.test_phase49_1_frontend_contract \
            store.test_phase49_3b_profile_media \
            store.test_phase49_3d_price_range \
            store.test_phase49_3f_pricing \
            catalog_bridge.test_phase49_unified_bridge \
            catalog_bridge.tests.test_epic49_contract \
            website.test_phase49_persian_sales_hero \
            website.test_phase49_3b_hero_media \
            website.test_phase49_2c_hero_studio \
            website.test_phase49_2b_hero_login_hotfix \
            website.test_phase45_homepage_hero \
            -v 2

      - name: Windows Catalog Center Epic49 tests
        working-directory: catalog_center
        run: |
          python -m unittest -v tests.test_phase49_unified_desktop
          python -m unittest -v tests.test_phase49_persian_sales_slider
          python -m unittest -v tests.test_epic49_readiness_wizard
          python -m unittest -v tests.test_phase49_3b_ai_diagnostics
          python -m unittest -v tests.test_phase49_3b_diagnostics_identity
          python -m unittest -v tests.test_phase49_3b_guided_wizard
          python -m unittest -v tests.test_epic49_phase49_3c_operator_recovery
          python -m unittest -v tests.test_epic49_phase49_3c_persian_content
          python -m unittest -v tests.test_epic49_phase49_3c_persian_translate_guard
          python -m unittest -v tests.test_epic49_phase49_3c_image_signature
          python -m unittest -v tests.test_epic49_phase49_3d_workflow_hardening
          python -m unittest -v tests.test_epic49_phase49_3d_ai_ui_cleanup
          python -m unittest -v tests.test_epic49_phase49_3e_ai_task_center
          python -m unittest -v tests.test_phase49_3f_product_intelligence
          python launch.py --verify-only | tee /tmp/phase49-verify.txt
          grep -F "EPIC49_3E_AI_TASK_CENTER=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3E_IMAGE_AI_SEO=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3E_OPERATOR_IMAGE_EDITOR=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3E_NON_BLOCKING_STAGE_NAV=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3E_LOCAL_PREFLIGHT_ALWAYS_ACCESSIBLE=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_SELECTED_IMAGE_TEXT_ONLY_AI=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_UNSELECTED_IMAGE_METADATA_PRESERVED=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_AI_PROGRESS_TIMEOUT=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_SCROLLABLE_AI_CENTER=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_GOOGLE_GEMINI_DIRECT=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_RUNTIME_TRACE=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_SOURCE_GROUNDED_TECHNICAL_AI=ENABLED" /tmp/phase49-verify.txt
          grep -F "EPIC49_3F_DYNAMIC_PRICING=ENABLED" /tmp/phase49-verify.txt
          grep -F "ACTIVE_RELEASE_VERIFIED=OK" /tmp/phase49-verify.txt
          python -m unittest discover -s tests -p 'test_*epic49*.py' -v

      - name: Full Django suite
        run: python manage.py test -v 1
