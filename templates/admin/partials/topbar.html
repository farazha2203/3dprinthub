{% load i18n static %}
<header id="page-topbar">
    <div class="layout-width">
        <div class="navbar-header">
            <div class="d-flex">
                <div class="navbar-brand-box horizontal-logo">
                    <a href="{% url 'admin:index' %}" class="logo logo-dark"><span class="logo-sm"><img src="{% static 'admin/brand/icon.png' %}" alt="" height="34"></span><span class="logo-lg admin-master-logo"><img src="{% static 'admin/brand/icon.png' %}" alt="" height="32"><span><b>3D</b>PrintHub<em>.ir</em></span></span></a>
                    <a href="{% url 'admin:index' %}" class="logo logo-light"><span class="logo-sm"><img src="{% static 'admin/brand/icon.png' %}" alt="" height="34"></span><span class="logo-lg admin-master-logo"><img src="{% static 'admin/brand/icon.png' %}" alt="" height="32"><span><b>3D</b>PrintHub<em>.ir</em></span></span></a>
                </div>
                <button type="button" class="btn btn-sm px-3 fs-16 header-item vertical-menu-btn topnav-hamburger" id="topnav-hamburger-icon" aria-label="باز و بسته کردن منو">
                    <span class="hamburger-icon"><span></span><span></span><span></span></span>
                </button>
                <div class="admin-topbar-title d-none d-md-flex align-items-center">
                    <div><strong>مرکز مدیریت 3DPrintHub</strong><small>عملیات، فروش، تولید و ارتباط با مشتری</small></div>
                </div>
            </div>

            <div class="d-flex align-items-center">
                <div class="dropdown d-md-none topbar-head-dropdown header-item">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" id="page-header-search-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><i class="bx bx-search fs-22"></i></button>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0"><div class="p-3"><div class="input-group"><input type="search" class="form-control" data-admin-global-search placeholder="جست‌وجو در صفحه..."><button class="btn btn-primary" type="button"><i class="mdi mdi-magnify"></i></button></div></div></div>
                </div>
                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" data-toggle="fullscreen" aria-label="تمام صفحه"><i class="bx bx-fullscreen fs-22"></i></button>
                </div>
                <div class="ms-1 header-item d-none d-sm-flex">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle light-dark-mode" aria-label="تغییر حالت روشن و تاریک"><i class="bx bx-moon fs-22"></i></button>
                </div>
                {% if perms.website.view_supportconversation %}
                <div class="dropdown topbar-head-dropdown ms-1 header-item" id="notificationDropdown">
                    <button type="button" class="btn btn-icon btn-topbar material-shadow-none btn-ghost-secondary rounded-circle" id="page-header-notifications-dropdown" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-haspopup="true" aria-expanded="false">
                        <i class="bx bx-bell fs-22"></i><span id="admin-support-unread-badge" class="position-absolute topbar-badge fs-10 translate-middle badge rounded-pill bg-danger" hidden>0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0">
                        <div class="dropdown-head bg-primary bg-pattern rounded-top"><div class="p-3"><div class="row align-items-center"><div class="col"><h6 class="m-0 fs-16 fw-semibold text-white">پیام‌های پشتیبانی</h6></div><div class="col-auto"><span id="admin-support-unread-label" class="badge bg-light-subtle text-body fs-13">۰ جدید</span></div></div></div></div>
                        <div class="p-3 text-center"><a href="{% url 'admin:website_supportconversation_changelist' %}" class="btn btn-soft-success waves-effect waves-light">باز کردن مرکز گفت‌وگو <i class="ri-arrow-left-line align-middle"></i></a></div>
                    </div>
                </div>
                {% endif %}
                <div class="dropdown ms-sm-3 header-item topbar-user">
                    <button type="button" class="btn material-shadow-none" id="page-header-user-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                        <span class="d-flex align-items-center"><span class="avatar-sm"><span class="avatar-title rounded-circle bg-warning-subtle text-warning"><i class="ri-user-3-line fs-20"></i></span></span><span class="text-start ms-xl-2"><span class="d-none d-xl-inline-block ms-1 fw-medium user-name-text">{% firstof request.user.get_short_name request.user.get_username %}</span><span class="d-none d-xl-block ms-1 fs-12 user-name-sub-text">مدیر سامانه</span></span></span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end"><h6 class="dropdown-header">خوش آمدید</h6><a class="dropdown-item" href="{% url 'admin:password_change' %}"><i class="mdi mdi-lock-reset text-muted fs-16 align-middle me-1"></i><span>تغییر رمز عبور</span></a><a class="dropdown-item" href="/" target="_blank"><i class="mdi mdi-web text-muted fs-16 align-middle me-1"></i><span>مشاهده سایت</span></a><div class="dropdown-divider"></div><form method="post" action="{% url 'admin:logout' %}">{% csrf_token %}<button type="submit" class="dropdown-item text-danger"><i class="mdi mdi-logout text-danger fs-16 align-middle me-1"></i><span>خروج</span></button></form></div>
                </div>
            </div>
        </div>
    </div>
</header>

<div class="notification-actions" id="notification-actions" hidden><span id="select-content">0</span></div>
<div id="removeNotificationModal" class="modal fade" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><button type="button" class="btn-close" data-bs-dismiss="modal" id="NotificationModalbtn-close"></button></div><div class="modal-body"><button type="button" id="delete-notification" class="btn btn-danger" data-bs-dismiss="modal">حذف</button></div></div></div></div>
