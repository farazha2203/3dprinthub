{% load static %}
<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="{% static 'css/main.css' %}"><link rel="stylesheet" href="{% static 'css/phase14-presentation.css' %}"><title>بازیابی رمز عبور | 3DPrintHub</title></head><body class="bg-[#f6f7f9] text-slate-950 min-h-screen">{% include "website/partials/header.html" %}<main class="container mx-auto px-6 pt-32 pb-16"><div class="max-w-xl mx-auto glass rounded-[2rem] p-6 md:p-8"><h1 class="text-3xl font-black mb-3">بازیابی رمز عبور</h1><p class="text-slate-500 mb-8">ایمیلی که هنگام عضویت ثبت کرده‌اید وارد کنید. لینک امن تغییر رمز برای شما ارسال می‌شود.</p>{% if form.errors %}<div class="mb-5 rounded-2xl bg-rose-50 text-rose-700 p-4">{{ form.errors }}</div>{% endif %}<form method="post" class="space-y-5">{% csrf_token %}<div><label class="block mb-2 text-sm text-slate-600">ایمیل حساب</label><input type="email" name="email" autocomplete="email" required class="form-input" placeholder="name@example.com"></div><button type="submit" class="w-full rounded-2xl btn-primary font-black py-4">ارسال لینک بازیابی</button></form><div class="mt-6 text-center"><a class="text-orange-500 font-bold" href="{% url 'website:customer_login' %}">بازگشت به ورود</a></div></div></main><script src="{% static 'js/main.js' %}"></script></body></html>
